<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC Mobile · Competiții</title>
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#070b16;--bg2:#0b1122;--panel:#0f172b;--panel2:#141d36;--panel3:#1a2544;--border:#1f2a48;--border2:#2b3a63;
  --text:#eaf0fb;--muted:#8d9bbb;--dim:#5b6890;
  --acc:#3b82f6;--accRGB:59,130,246;--acc2:#22d3ee;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--gold:#f5c542;
  --r:16px;--sh:0 18px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1100px 620px at 85% -15%,rgba(var(--accRGB),.13),transparent 60%),
  radial-gradient(900px 520px at -15% 115%,rgba(34,211,238,.07),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#22305a;border-radius:9px;border:2px solid var(--bg)}
#app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
#sidebar{background:linear-gradient(180deg,rgba(11,17,34,.96),rgba(7,11,22,.96));border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;overflow:auto;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px;cursor:pointer}
.brand .lg{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),#a78bfa,var(--acc));display:grid;place-items:center;box-shadow:0 8px 22px rgba(var(--accRGB),.35)}
.brand .lg svg{stroke:#fff;width:22px;height:22px}
.brand b{display:block;font-family:Rajdhani,Inter,sans-serif;font-size:19px;letter-spacing:.6px;line-height:1.05}
.brand small{color:var(--muted);font-size:11.5px}
.cbox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--border);cursor:pointer}
.cbox:hover{border-color:var(--border2)}
.cbox .t{min-width:0;flex:1}.cbox .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.cbox .t small{color:var(--muted);font-size:11.5px}
.navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:4px 8px -6px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:600;font-size:13.5px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(var(--accRGB),.2),rgba(var(--accRGB),.03));color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.nav button.on svg{color:var(--acc)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.userbox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--border)}
.userbox .t{flex:1;min-width:0}.userbox b{display:block;font-size:13px}.userbox small{color:var(--muted);font-size:11.5px}
/* ---------- main ---------- */
main{min-width:0}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 30px;border-bottom:1px solid var(--border);background:rgba(7,11,22,.72);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30}
#topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px}
#topbar .sub{color:var(--muted);font-size:12.5px}
#topbar .sp{flex:1}
#menuBtn{display:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.sync.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.sync.bad i{background:var(--bad)}
#view{padding:26px 30px 80px;max-width:1440px;margin:0 auto}
/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;font-weight:650;font-size:13px;white-space:nowrap;transition:.15s;color:var(--text)}
.btn:hover{border-color:#41548a;background:var(--panel3)}
.btn.primary{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#22d3ee));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(var(--accRGB),.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#03210f}
.btn.danger{color:#fecaca;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
.btn.danger:hover{background:rgba(239,68,68,.2)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.lg{padding:12px 20px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;flex:none}
.ib:hover{background:var(--panel3);color:var(--text);border-color:var(--border2)}
.ib.danger:hover{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sp{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:linear-gradient(180deg,rgba(17,25,48,.95),rgba(13,20,40,.92));border:1px solid var(--border);border-radius:var(--r);padding:18px;position:relative}
.card>h3{margin:0 0 14px;font-size:14.5px;letter-spacing:.1px;display:flex;align-items:center;gap:9px;font-weight:750}
.card>h3 .sp{flex:1}
.card>h3 svg{color:var(--acc)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h2{margin:0;font-size:26px;letter-spacing:-.5px;font-weight:850}
.ph p{margin:4px 0 0;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:850;letter-spacing:-.8px;font-family:Rajdhani,Inter;line-height:1.1}
.kpi .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.ok{color:#4ade80;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.09)}
.chip.warn{color:#fbbf24;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.09)}
.chip.bad{color:#f87171;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.09)}
.chip.acc{color:var(--acc);border-color:rgba(var(--accRGB),.4);background:rgba(var(--accRGB),.1)}
.chip.gold{color:var(--gold);border-color:rgba(245,197,66,.4);background:rgba(245,197,66,.1)}
.bar{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--r)}
.empty svg{width:34px;height:34px;color:var(--dim);margin-bottom:8px}
.banner{display:flex;gap:11px;align-items:center;padding:12px 15px;border-radius:13px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fde3a7;margin-bottom:18px}
.banner.info{background:rgba(var(--accRGB),.08);border-color:rgba(var(--accRGB),.3);color:#cfe0ff}
.banner.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#bbf7d0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:650;font-size:12.5px}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
/* ---------- tables ---------- */
.tw{overflow-x:auto;border-radius:13px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:800;padding:10px 10px;background:rgba(20,29,54,.9);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(31,42,72,.65);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(26,37,68,.5)}
.tbl .c{text-align:center}.tbl .r{text-align:right}.tbl .b{font-weight:800}
.tbl td.zone{padding:0;width:4px}
.tbl tr.sep td{border-top:2px dashed rgba(255,255,255,.08)}
.zone i{display:block;width:4px;height:38px;border-radius:0 3px 3px 0}
.pos{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:8px;background:var(--panel3);font-weight:800;font-size:12px}
.pts{font-weight:900;font-size:14px}
.form{display:inline-flex;gap:3px}
.form b{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800}
.form .W{background:#16a34a;color:#fff}.form .D{background:#64748b;color:#fff}.form .L{background:#dc2626;color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* team */
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team .nm{min-width:0}
.team b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.team small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;display:grid;place-items:center;overflow:hidden;border-radius:10px}
.logo img{width:100%;height:100%;display:block}
.logo.lph{font-weight:900;color:#fff;font-family:Rajdhani,Inter;letter-spacing:.3px;border:1px solid rgba(255,255,255,.12)}
.clk{cursor:pointer}
.clk:hover b{color:var(--acc)}
/* ---------- matches ---------- */
.mlist{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:rgba(20,29,54,.6);border:1px solid var(--border)}
.match:hover{border-color:var(--border2)}
.match .h{justify-content:flex-end;text-align:right}
.match .h .team{flex-direction:row-reverse}
.match .meta{display:flex;align-items:center;gap:4px}
.score{display:flex;align-items:center;gap:6px;font-family:Rajdhani,Inter;font-weight:700}
.score .s{min-width:36px;height:36px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-size:21px;background:var(--panel3);border:1px solid var(--border2)}
.score .s.w{background:rgba(var(--accRGB),.2);border-color:rgba(var(--accRGB),.5)}
.score .vs{color:var(--dim);font-size:13px;font-family:Inter;font-weight:700;min-width:58px;text-align:center}
.score input{width:46px;height:36px;text-align:center;border-radius:10px;border:1px solid var(--border2);background:var(--bg2);font-size:18px;font-weight:800;font-family:Rajdhani,Inter}
.score input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accRGB),.2)}
.pens{font-size:11px;color:var(--muted);text-align:center;font-family:Inter;font-weight:600}
.rhead{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.rhead:first-child{margin-top:0}
.rhead::after{content:"";flex:1;height:1px;background:var(--border)}
/* ---------- bracket ---------- */
.bracket{display:flex;gap:26px;overflow-x:auto;padding:6px 2px 14px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:214px;flex:1}
.bcol>h4{margin:0 0 4px;text-align:center;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);font-weight:800}
.tie{background:rgba(20,29,54,.85);border:1px solid var(--border2);border-radius:13px;overflow:hidden;position:relative}
.tie .tr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.tie .tr:last-of-type{border-bottom:0}
.tie .tr .team{flex:1}
.tie .tr .g{font-family:Rajdhani,Inter;font-weight:700;font-size:16px;min-width:22px;text-align:right;color:var(--muted)}
.tie .tr.win{background:linear-gradient(90deg,rgba(var(--accRGB),.18),transparent)}
.tie .tr.win .g,.tie .tr.win b{color:var(--text)}
.tie .tr.lose{opacity:.55}
.tie .foot{font-size:11px;color:var(--muted);padding:5px 10px;background:rgba(0,0,0,.18);display:flex;justify-content:space-between;gap:6px}
.tie.final{border-color:rgba(245,197,66,.5);box-shadow:0 0 0 1px rgba(245,197,66,.15),0 10px 30px rgba(245,197,66,.08)}
.champ{display:flex;align-items:center;gap:18px;padding:22px;border-radius:18px;background:linear-gradient(135deg,rgba(245,197,66,.2),rgba(245,197,66,.03));border:1px solid rgba(245,197,66,.45);margin-bottom:20px}
.champ .tt{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);font-weight:800}
.champ .nn{font-size:26px;font-weight:900;letter-spacing:-.4px}
/* ---------- hero ---------- */
.hero{display:flex;align-items:center;gap:22px;padding:24px;border-radius:20px;border:1px solid var(--border2);background:
  radial-gradient(600px 220px at 100% 0%,rgba(var(--accRGB),.28),transparent 70%),linear-gradient(135deg,var(--panel2),var(--panel));margin-bottom:20px;position:relative;overflow:hidden}
.hero h2{margin:0;font-size:30px;font-weight:900;letter-spacing:-.7px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ctype{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:18px;border:1px solid var(--border2);background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;transition:.18s;text-align:left;color:var(--text)}
.ctype:hover,.ctype.on{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 14px 34px rgba(var(--accRGB),.18)}
.ctype .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center}
.ctype .ic svg{width:28px;height:28px;stroke:#fff}
.ctype b{font-size:16.5px}.ctype p{margin:0;color:var(--muted);font-size:12.8px}
.ccard{padding:0;overflow:hidden;cursor:pointer;transition:.18s}
.ccard:hover{transform:translateY(-2px);border-color:var(--border2)}
.ccard .top{height:84px;position:relative}
.ccard .bd{padding:14px 16px 16px;margin-top:-34px;position:relative}
/* ---------- forms ---------- */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:12px;color:var(--muted);font-weight:650}
.fg .hint{font-size:11.5px;color:var(--dim)}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accRGB),.18)}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
select.in.sm,.in.sm{padding:6px 9px;font-size:12.5px;border-radius:9px;width:auto}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;margin-bottom:10px}
.check input{width:17px;height:17px;accent-color:var(--acc)}
.logo-up{display:flex;align-items:center;gap:14px}
/* ---------- modal ---------- */
.mb{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:18px;animation:fd .15s}
.md{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:linear-gradient(180deg,#121b33,#0d1428);border:1px solid var(--border2);border-radius:20px;box-shadow:var(--sh);animation:pp .18s}
.md.wide{width:min(900px,100%)}.md.xwide{width:min(1200px,100%)}
.md .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#121b33;z-index:2}
.md .mh h3{margin:0;font-size:16px;flex:1}
.md .mbd{padding:20px}
.md .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#0d1428}
@keyframes fd{from{opacity:0}}@keyframes pp{from{transform:translateY(10px) scale(.98);opacity:0}}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{padding:11px 15px;border-radius:12px;background:#16213d;border:1px solid var(--border2);box-shadow:var(--sh);font-weight:600;font-size:13px;display:flex;gap:9px;align-items:center;animation:pp .2s;max-width:380px}
.toast.ok{border-color:rgba(34,197,94,.5)}.toast.err{border-color:rgba(239,68,68,.55);color:#fecaca}
/* ---------- stats ---------- */
.lead{display:flex;flex-direction:column;gap:6px}
.lead .li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
.lead .li:nth-child(1){background:rgba(245,197,66,.08)}
.lead .li .v{font-family:Rajdhani,Inter;font-weight:700;font-size:18px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) 1fr 40px;gap:10px;align-items:center;margin-bottom:8px;font-size:12.5px}
.hbar .b{height:10px;border-radius:9px;background:var(--panel3);overflow:hidden}.hbar .b i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:650;font-size:12.5px}
.tabs button.on{border-color:var(--acc);color:var(--text);background:rgba(var(--accRGB),.12)}
.snap-head{display:none}
.capturing{width:max-content!important;min-width:640px;max-width:none!important}
.capturing .tw{overflow:visible!important}
.capturing .nosnap{display:none!important}
.capturing .snap-head{display:flex!important;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border2)}
.snap-head .t b{display:block;font-size:17px;font-weight:850}.snap-head .t small{color:var(--muted)}
.snap-foot{display:none}.capturing .snap-foot{display:block;margin-top:12px;font-size:11px;color:var(--dim);text-align:right}

// citește o imagine, o încadrează într-un pătrat transparent (fără deformare la capturi)
function readImage(file, max = 192){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = max; const x = c.getContext('2d');
      const s = Math.min(max / img.width, max / img.height); const w = img.width * s, h = img.height * s;
      x.imageSmoothingQuality = 'high'; x.drawImage(img, (max - w) / 2, (max - h) / 2, w, h);
      let out = c.toDataURL('image/webp', .9); if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      res(out);
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* SHA-256 (fără dependențe, funcționează și offline) */
function sha256(str){
  const ascii = unescape(encodeURIComponent(str)); const rr_ = (v, a) => (v >>> a) | (v << (32 - a)); const max = 2 ** 32;
  const H = [], K = []; let pc = 0; const comp = {};
  for (let c = 2; pc < 64; c++){ if (!comp[c]){ for (let i = 0; i < 313; i += c) comp[i] = c; H[pc] = (Math.pow(c, .5) * max) | 0; K[pc++] = (Math.pow(c, 1 / 3) * max) | 0; } }
  let msg = ascii + '\x80'; while (msg.length % 64 - 56) msg += '\x00';
  const w = []; for (let i = 0; i < msg.length; i++) w[i >> 2] |= msg.charCodeAt(i) << ((3 - i) % 4) * 8;
  const bl = ascii.length * 8; w[w.length] = (bl / max) | 0; w[w.length] = bl;
  let hash = H.slice(0, 8);
  for (let j = 0; j < w.length;){
    const W = w.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++){
      const w15 = W[i - 15], w2 = W[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr_(e, 6) ^ rr_(e, 11) ^ rr_(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i]
        + (W[i] = i < 16 ? W[i] : (W[i - 16] + (rr_(w15, 7) ^ rr_(w15, 18) ^ (w15 >>> 3)) + W[i - 7] + (rr_(w2, 17) ^ rr_(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr_(a, 2) ^ rr_(a, 13) ^ rr_(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  let out = ''; for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--){ const b = (hash[i] >> (j * 8)) & 255; out += (b < 16 ? '0' : '') + b.toString(16); }
  return out;
}

/* ---------------- normalizare (Firebase nu păstrează liste goale / null) ---------------- */
const arr = v => !v ? [] : Array.isArray(v) ? v.filter(x => x != null) : Object.keys(v).sort((a, b) => a - b).map(k => v[k]).filter(x => x != null);
const obj = v => (v && typeof v === 'object') ? (Array.isArray(v) ? Object.fromEntries(v.filter(Boolean).map(x => [x.id, x])) : v) : {};
function normC(c){
  c.settings = {...DEFAULTS.common, ...DEFAULTS[c.type], ...(c.settings || {})};
  c.teams = obj(c.teams); c.matches = obj(c.matches);
  Object.values(c.teams).forEach(t => { t.deduct = +t.deduct || 0; });
  Object.values(c.matches).forEach(m => {
    m.sc = m.sc || {}; m.sc.h = arr(m.sc.h); m.sc.a = arr(m.sc.a);
    m.played = !!m.played; m.hs = numOr(m.hs); m.as = numOr(m.as); m.ph = numOr(m.ph); m.pa = numOr(m.pa);
  });
  c.plan = arr(c.plan);
  c.order = c.order || {};
  Object.keys(c.order).forEach(k => c.order[k] = arr(c.order[k]));
  c.groups = arr(c.groups);
  if (c.ko){ c.ko.rounds = arr(c.ko.rounds).map(r => ({...r, ties: arr(r.ties)})); } else c.ko = null;
  c.history = arr(c.history);
  c.status = c.status === 'incheiat' ? 'incheiat' : 'activ';
  return c;
}

/* ---------------- sincronizare ---------------- */
let fdb = null;
const Sync = {
  mode: 'local', loaded: false, online: false, err: '',
  init(){
    try { if (window.firebase && firebase.initializeApp){ if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); fdb = firebase.database(); this.mode = 'cloud'; } }
    catch (e){ console.error(e); }
    if (this.mode !== 'cloud') return this.initLocal();
    fdb.ref('.info/connected').on('value', s => { this.online = !!s.val(); renderTop(); });
    this.to = setTimeout(() => { if (!this.loaded){ this.err = 'Conexiunea la baza de date durează prea mult.'; render(); } }, 12000);
    fdb.ref(DB_ROOT).on('value', snap => {
      const v = snap.val() || {};
      clearTimeout(this.to); this.err = '';
      DB.admins = v.admins || {};
      const comps = v.comps || {};
      DB.comps = {}; Object.keys(comps).forEach(k => { if (comps[k]) DB.comps[k] = normC(comps[k]); });
      this.loaded = true; softRender();
    }, e => this.fail(e));
  },
  initLocal(){
    this.mode = 'local';
    try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); if (d){ DB.admins = d.admins || {}; DB.comps = {}; Object.values(d.comps || {}).forEach(c => DB.comps[c.id] = normC(c)); } } catch {}
    this.loaded = true; render();
  },
  saveLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(DB)); } catch (e){ toast('Memoria browserului e plină – exportă un backup.', 'err'); } },
  fail(e){
    console.error(e); const m = String(e && (e.code || e.message) || e);
    this.err = /permission/i.test(m) ? 'Baza de date a refuzat accesul (PERMISSION_DENIED). Adaugă în regulile Firebase nodurile „' + DB_ROOT + '” și „' + AUDIT_ROOT + '”.' : 'Eroare bază de date: ' + m;
    toast(this.err, 'err'); if (!this.loaded) render();
  },
  // modificările se fac întâi în memorie (DB), apoi se persistă calea
  set(path, val){
    if (this.mode !== 'cloud'){ this.saveLocal(); return Promise.resolve(); }

const mOrder = (a, b) => (a.round || 0) - (b.round || 0) || (a.leg || 0) - (b.leg || 0) || String(a.date || '').localeCompare(String(b.date || '')) || (a.created || 0) - (b.created || 0);
const pk = (a, b) => a < b ? a + '|' + b : b + '|' + a;

/* ---------------- programare: round-robin (Berger) ---------------- */
function berger(ids){
  const a = [...ids]; if (a.length % 2) a.push(null);
  const n = a.length, R = [];
  for (let r = 0; r < n - 1; r++){
    const ps = [];
    for (let i = 0; i < n / 2; i++){
      const x = a[i], y = a[n - 1 - i]; if (!x || !y) continue;
      const flip = i === 0 ? r % 2 === 1 : (i + r) % 2 === 1;
      ps.push(flip ? [y, x] : [x, y]);
    }
    R.push(ps); a.splice(1, 0, a.pop());
  }
  return R;
}
// meciurile rămase de programat, grupate în etape (respectă ordinea Berger; acceptă echipe adăugate oricând)
function pendingRounds(order, legs, existing){
  const base = berger(order), seq = [];
  for (let l = 0; l < legs; l++) base.forEach(rd => rd.forEach(([h, a]) => seq.push(l % 2 ? [a, h] : [h, a])));
  const used = {}, homes = {};
  existing.forEach(m => { const k = pk(m.home, m.away); (used[k] = used[k] || []).push(m.home); (homes[k] = homes[k] || []).push(m.home); });
  const rem = [];
  for (let [h, a] of seq){
    const k = pk(h, a), u = used[k];
    if (u && u.length){ const i = u.indexOf(h); u.splice(i >= 0 ? i : 0, 1); continue; }
    const hs = homes[k] || []; const hc = hs.filter(x => x === h).length, ac = hs.length - hc;
    if (hc > ac) [h, a] = [a, h];
    (homes[k] = homes[k] || []).push(h);
    rem.push([h, a]);
  }
  const rounds = []; let L = rem;
  while (L.length){
    const busy = new Set(), rd = [], rest = [];
    for (const p of L){ if (busy.has(p[0]) || busy.has(p[1])) rest.push(p); else { rd.push(p); busy.add(p[0]); busy.add(p[1]); } }
    rounds.push(rd); L = rest;
  }
  return rounds;
}
function ensureOrder(c, key, ids){
  const cur = (c.order[key] || []).filter(id => ids.includes(id));
  const add = shuffle(ids.filter(id => !cur.includes(id)));
  c.order[key] = [...cur, ...add]; return c.order[key];
}
function poolsOf(c){
  if (c.type === 'league') return [
    {key: 'd1', name: c.settings.div1, ids: teams(c).filter(t => t.div === 'd1').map(t => t.id), legs: c.settings.legs, f: m => m.stage === 'league' && m.div === 'd1', extra: {stage: 'league', div: 'd1'}},
    {key: 'd2', name: c.settings.div2, ids: teams(c).filter(t => t.div === 'd2').map(t => t.id), legs: c.settings.legs, f: m => m.stage === 'league' && m.div === 'd2', extra: {stage: 'league', div: 'd2'}}];
  if (c.type === 'wc') return c.groups.map(g => ({key: 'g' + g.id, name: g.name, gid: g.id, ids: teams(c).filter(t => t.group === g.id).map(t => t.id), legs: c.settings.groupLegs,
    f: m => m.stage === 'group' && m.group === g.id, extra: {stage: 'group', group: g.id}}));

}
function poolPending(c, p){
  if (p.ids.length < 2) return [];
  const order = (c.order[p.key] || []).filter(id => p.ids.includes(id));
  const full = [...order, ...p.ids.filter(id => !order.includes(id))];
  const ex = ms(c).filter(p.f).filter(m => p.ids.includes(m.home) && p.ids.includes(m.away));
  return pendingRounds(full, p.legs, ex);
}
// generează etapa următoare (all=false) sau toate etapele rămase
function genPool(c, p, all){
  if (p.ids.length < 2) return [];
  const order = ensureOrder(c, p.key, p.ids);
  const ex = ms(c).filter(p.f);
  const rounds = pendingRounds(order, p.legs, ex.filter(m => p.ids.includes(m.home) && p.ids.includes(m.away)));
  const r0 = Math.max(0, ...ex.map(m => m.round || 0));
  const take = all ? rounds : rounds.slice(0, 1);
  const out = [];
  take.forEach((rd, i) => rd.forEach(([h, a]) => out.push(newMatch(c, {...p.extra, round: r0 + i + 1, home: h, away: a}))));

/* ---------------- UCL: tragerea fazei ligii ---------------- */
function colorEdges(edges, ids, K, attempts = 250){
  for (let att = 0; att < attempts; att++){
    const at = {}; ids.forEach(id => at[id] = new Array(K).fill(-1));
    const col = new Array(edges.length).fill(-1); let ok = true;
    for (const e of shuffle(edges.map((_, i) => i))){
      const [u, v] = edges[e]; let cc = -1;
      for (let k = 0; k < K; k++) if (at[u][k] < 0 && at[v][k] < 0){ cc = k; break; }
      if (cc < 0){
        const fu = [], fv = []; for (let k = 0; k < K; k++){ if (at[u][k] < 0) fu.push(k); if (at[v][k] < 0) fv.push(k); }
        outer: for (const a of shuffle(fu)) for (const b of shuffle(fv)){
          const path = []; let x = v, cur = a, hit = false;
          while (true){ const ed = at[x][cur]; if (ed < 0) break; path.push(ed); const [p, q] = edges[ed]; const y = p === x ? q : p; if (y === u){ hit = true; break; } x = y; cur = cur === a ? b : a; if (path.length > edges.length) { hit = true; break; } }
          if (hit) continue;
          path.forEach(ed => { const [p, q] = edges[ed]; at[p][col[ed]] = -1; at[q][col[ed]] = -1; });
          path.forEach(ed => { const nc = col[ed] === a ? b : a; col[ed] = nc; const [p, q] = edges[ed]; at[p][nc] = ed; at[q][nc] = ed; });
          if (at[u][a] < 0 && at[v][a] < 0){ cc = a; break outer; }
        }
      }
      if (cc < 0){ ok = false; break; }
      col[e] = cc; at[u][cc] = e; at[v][cc] = e;
    }
    if (ok) return col;
  }
  return null;
}
function uclDraw(c){
  const M = c.settings.matchesPerTeam, ids = teams(c).map(t => t.id), N = ids.length;
  if (M % 2) throw new Error('Numărul de meciuri pe echipă trebuie să fie par.');
  if (N < M + 1) throw new Error(`Pentru ${M} meciuri pe echipă sunt necesare cel puțin ${M + 1} echipe (acum: ${N}). Scade numărul de meciuri din Regulament.`);
  const P = M / 2, S = N / P;
  const pots = Array.from({length: P}, (_, i) => shuffle(teams(c).filter(t => +t.pot === i + 1).map(t => t.id)));
  const potOK = Number.isInteger(S) && S >= 3 && pots.every(p => p.length === S);
  let edges = [], mode;
  if (potOK){
    mode = 'urne';
    for (let i = 0; i < P; i++){ const A = pots[i]; for (let k = 0; k < S; k++) edges.push([A[k], A[(k + 1) % S]]); }
    for (let i = 0; i < P; i++) for (let j = i + 1; j < P; j++){
      const A = pots[i], B = pots[j], sg = shuffle([...Array(S).keys()]), sh = 1 + rnd(S - 1);
      for (let k = 0; k < S; k++){ edges.push([A[k], B[sg[k]]]); edges.push([B[sg[(k + sh) % S]], A[k]]); }
    }
  } else {
    mode = 'echilibrat';
    const o = shuffle(ids);
    for (let i = 0; i < N; i++) for (let d = 1; d <= P; d++) edges.push([o[i], o[(i + d) % N]]);
  }
  const E = edges.length, Kmin = Math.max(M, Math.ceil(E / Math.floor(N / 2)));
  let col = null, K = Kmin;
  for (; K <= Kmin + 6 && !col; K++) col = colorEdges(edges, ids, K, K === Kmin ? 300 : 120);
  if (!col){ col = []; const busy = {}; edges.forEach((e, i) => { let k = 0; while ((busy[k] || new Set()).has(e[0]) || (busy[k] || new Set()).has(e[1])) k++; (busy[k] = busy[k] || new Set()).add(e[0]); busy[k].add(e[1]); col[i] = k; }); }
  // renumerotare etape în ordinea 1..K
  const used = [...new Set(col)].sort((a, b) => a - b); const map = {}; used.forEach((k, i) => map[k] = i + 1);
  c.plan = edges.map((e, i) => ({h: e[0], a: e[1], r: map[col[i]]})).sort((a, b) => a.r - b.r);
  c.drawMode = mode;
  return {mode, rounds: used.length};
}
function uclPendingPlan(c){
  const have = new Set(ms(c).filter(m => m.stage === 'league').map(m => m.home + '>' + m.away));
  return c.plan.filter(p => !have.has(p.h + '>' + p.a) && c.teams[p.h] && c.teams[p.a]);
}
function uclGen(c, all){
  const pend = uclPendingPlan(c); if (!pend.length) return [];
  const r = Math.min(...pend.map(p => p.r));
  return pend.filter(p => all || p.r === r).map(p => newMatch(c, {stage: 'league', round: p.r, home: p.h, away: p.a}));
}
function autoPots(c, mode){
  const n = c.type === 'ucl' ? c.settings.matchesPerTeam / 2 : c.settings.groupSize;
  const list = mode === 'random' ? shuffle(teams(c)) : teams(c).sort((a, b) => (a.pot || 99) - (b.pot || 99) || (a.created || 0) - (b.created || 0));
  const per = Math.ceil(list.length / n);
  list.forEach((t, i) => t.pot = Math.min(n, Math.floor(i / per) + 1));

/* ---------------- Cupa Mondială: tragerea grupelor ---------------- */
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function wcGroupCount(c){ const N = Object.keys(c.teams).length; return c.settings.groups > 0 ? c.settings.groups : Math.max(1, Math.ceil(N / c.settings.groupSize)); }
function wcDraw(c){
  const G = wcGroupCount(c);
  c.groups = Array.from({length: G}, (_, i) => ({id: LETTERS[i] || ('G' + (i + 1)), name: 'Grupa ' + (LETTERS[i] || (i + 1))}));
  const size = {}; c.groups.forEach(g => size[g.id] = 0);
  const all = teams(c); all.forEach(t => delete t.group);
  const potNums = [...new Set(all.map(t => +t.pot || 99))].sort((a, b) => a - b);
  potNums.forEach(p => {
    const list = shuffle(all.filter(t => (+t.pot || 99) === p));
    list.forEach(t => {
      const min = Math.min(...c.groups.map(g => size[g.id]));
      const cand = shuffle(c.groups.filter(g => size[g.id] === min));
      t.group = cand[0].id; size[t.group]++;
    });
  });
  c.order = {};
}
function wcAssignNew(c, t){
  if (!c.groups.length) return;
  const cnt = g => teams(c).filter(x => x.group === g.id && x.id !== t.id).length;
  const min = Math.min(...c.groups.map(cnt)); t.group = shuffle(c.groups.filter(g => cnt(g) === min))[0].id;

/* ---------------- clasamente ---------------- */
function ptsOf(c, gf, ga){ const s = c.settings; return gf > ga ? +s.ptsWin : gf === ga ? +s.ptsDraw : +s.ptsLoss; }
function table(c, ids, matches, o = {}){
  const venue = o.venue || 'all', mode = o.mode || c.settings.tiebreak || 'gd';
  const R = {}; ids.forEach(id => R[id] = {id, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0, aGF: 0, aW: 0, cs: 0, form: [], opp: []});
  const pl = matches.filter(m => m.played && R[m.home] && R[m.away]).sort(mOrder);
  const side = (r, gf, ga, away, opp) => {
    r.P++; r.GF += gf; r.GA += ga; r.Pts += ptsOf(c, gf, ga); r.opp.push(opp);
    if (gf > ga){ r.W++; r.form.push('W'); if (away) r.aW++; } else if (gf === ga){ r.D++; r.form.push('D'); } else { r.L++; r.form.push('L'); }
    if (away) r.aGF += gf; if (ga === 0) r.cs++;
  };
  pl.forEach(m => { if (venue !== 'away') side(R[m.home], m.hs, m.as, false, m.away); if (venue !== 'home') side(R[m.away], m.as, m.hs, true, m.home); });
  const rows = Object.values(R);
  rows.forEach(r => { r.GD = r.GF - r.GA; if (venue === 'all'){ r.ded = (c.teams[r.id] && c.teams[r.id].deduct) || 0; r.Pts -= r.ded; } r.form = r.form.slice(-5); });
  const nm = (a, b) => (c.teams[a.id]?.name || '').localeCompare(c.teams[b.id]?.name || '');
  const by = keys => (a, b) => { for (const k of keys){ const d = (b[k] || 0) - (a[k] || 0); if (d) return d; } return 0; };
  if (mode === 'ucl'){
    rows.forEach(r => { r.oPts = sum(r.opp, id => R[id]?.Pts); r.oGD = sum(r.opp, id => R[id]?.GD); r.oGF = sum(r.opp, id => R[id]?.GF); });
    rows.sort((a, b) => by(['Pts', 'GD', 'GF', 'aGF', 'W', 'aW', 'oPts', 'oGD', 'oGF'])(a, b) || nm(a, b));
  } else if (mode === 'h2h'){
    rows.sort(by(['Pts']));
    const out = []; let i = 0;
    while (i < rows.length){
      let j = i; while (j < rows.length && rows[j].Pts === rows[i].Pts) j++;
      const blk = rows.slice(i, j);
      if (blk.length > 1){
        const set = new Set(blk.map(r => r.id)); const H = {}; blk.forEach(r => H[r.id] = {p: 0, gd: 0, gf: 0});
        pl.filter(m => set.has(m.home) && set.has(m.away)).forEach(m => {
          H[m.home].p += ptsOf(c, m.hs, m.as); H[m.away].p += ptsOf(c, m.as, m.hs);
          H[m.home].gd += m.hs - m.as; H[m.away].gd += m.as - m.hs; H[m.home].gf += m.hs; H[m.away].gf += m.as; });
        blk.forEach(r => { r.hP = H[r.id].p; r.hGD = H[r.id].gd; r.hGF = H[r.id].gf; });
        blk.sort((a, b) => by(['hP', 'hGD', 'hGF', 'GD', 'GF', 'W'])(a, b) || nm(a, b));
      }
      out.push(...blk); i = j;
    }
    rows.splice(0, rows.length, ...out);
  } else rows.sort((a, b) => by(['Pts', 'GD', 'GF', 'W'])(a, b) || nm(a, b));
  rows.forEach((r, i) => r.pos = i + 1);
  return rows;
}
const leaguePhase = c => ms(c).filter(m => m.stage === 'league');
function uclTable(c, venue){ return table(c, teams(c).map(t => t.id), leaguePhase(c), {venue}); }
function divTable(c, d, venue){ return table(c, teams(c).filter(t => t.div === d).map(t => t.id), ms(c).filter(m => m.stage === 'league' && m.div === d), {venue}); }
function groupTable(c, gid, venue){ return table(c, teams(c).filter(t => t.group === gid).map(t => t.id), ms(c).filter(m => m.stage === 'group' && m.group === gid), {venue}); }

/* ---------------- progres ---------------- */
function phaseProgress(c){
  let total = 0, played = 0;
  if (c.type === 'ucl'){ const lm = leaguePhase(c); total = lm.length + uclPendingPlan(c).length; played = lm.filter(m => m.played).length; }
  else poolsOf(c).forEach(p => { const ex = ms(c).filter(p.f); total += ex.length + sum(poolPending(c, p), r => r.length); played += ex.filter(m => m.played).length; });
  return {total, played, done: total > 0 && total === played};
}

/* ---------------- eliminatorii ---------------- */
function seedOrder(n){ let o = [1]; while (o.length < n){ const m = o.length * 2; o = o.flatMap(s => [s, m + 1 - s]); } return o; }
function roundName(n, third){
  if (third) return 'Finala mică';
  return ({2: 'Finala', 4: 'Semifinale', 8: 'Sferturi de finală', 16: 'Optimi de finală', 32: 'Șaisprezecimi de finală', 64: 'Runda de 64', 128: 'Runda de 128'})[n] || ('Runda de ' + n);
}
function pairSwap(c, list){ list = [...list]; if (c.settings.pairDraw) for (let i = 0; i + 1 < list.length; i += 2) if (rnd(2)) [list[i], list[i + 1]] = [list[i + 1], list[i]]; return list; }
const slotT = id => id ? {t: id} : {bye: true};
function chainRounds(c, first, size){
  const rounds = [first]; let prev = first, n = size / 2;
  while (prev.ties.length > 1){
    const ties = []; for (let i = 0; i < prev.ties.length; i += 2) ties.push({id: uid(), a: {w: prev.ties[i].id}, b: {w: prev.ties[i + 1].id}});
    const isFinal = ties.length === 1;
    const r = {key: 'r' + n, name: roundName(n), legs: isFinal ? +c.settings.finalLegs : +c.settings.koLegs, ties};
    if (isFinal && c.type === 'wc' && c.settings.thirdPlace && prev.ties.length === 2){
      rounds.push({key: 'third', name: roundName(0, true), third: true, legs: 1, ties: [{id: uid(), a: {l: prev.ties[0].id}, b: {l: prev.ties[1].id}}]});
    }
    rounds.push(r); prev = r; n = n / 2;
  }
  rounds.forEach(r => r.ties.forEach(t => t.legs = r.legs));
  return rounds;
}
function bracketFromSeeds(c, seeds, avoid){
  const K = Math.max(2, nextPow2(seeds.length)); const S = [...seeds]; while (S.length < K) S.push(null);
  const so = seedOrder(K); const pairs = [];
  for (let i = 0; i < K; i += 2) pairs.push([S[so[i] - 1], S[so[i + 1] - 1]]);
  if (avoid){
    for (let pass = 0; pass < 3; pass++) pairs.forEach((p, i) => {
      if (!p[0] || !p[1] || !avoid(p[0], p[1])) return;
      for (let j = 0; j < pairs.length; j++){ const q = pairs[j]; if (j === i || !q[1] || !q[0]) continue;
        if (!avoid(p[0], q[1]) && !avoid(q[0], p[1])){ [p[1], q[1]] = [q[1], p[1]]; break; } }
    });
  }
  const first = {key: 'r' + K, name: roundName(K), legs: K === 2 ? +c.settings.finalLegs : +c.settings.koLegs, ties: pairs.map(([a, b]) => ({id: uid(), a: slotT(a), b: slotT(b)}))};
  return chainRounds(c, first, K);
}
function uclBuildKO(c){
  const D = +c.settings.direct, st = uclTable(c).map(r => r.id);
  if (!isPow2(D)) throw new Error('Numărul de echipe calificate direct trebuie să fie putere a lui 2 (2, 4, 8, 16).');
  if (c.settings.playoff){
    if (st.length < 3 * D) throw new Error(`Faza eliminatorie cu play-off necesită ${3 * D} echipe (locurile 1–${3 * D}). Ai ${st.length}.`);
    const top = pairSwap(c, st.slice(0, D)), sd = pairSwap(c, st.slice(D, 2 * D)), un = pairSwap(c, st.slice(2 * D, 3 * D));
    const order = seedOrder(D); const po = [], main = [];
    order.forEach(s => {
      const pt = {id: uid(), a: {t: sd[D - s]}, b: {t: un[s - 1]}}; po.push(pt);
      main.push({id: uid(), a: {t: top[s - 1]}, b: {w: pt.id}});
    });
    const size = 2 * D;
    const r0 = {key: 'po', name: 'Play-off eliminatoriu', legs: +c.settings.playoffLegs, ties: po, playoff: true};
    const r1 = {key: 'r' + size, name: roundName(size), legs: size === 2 ? +c.settings.finalLegs : +c.settings.koLegs, ties: main};
    const rounds = chainRounds(c, r1, size); r0.ties.forEach(t => t.legs = r0.legs);
    c.ko = {rounds: [r0, ...rounds], built: Date.now()};
  } else {
    if (st.length < D) throw new Error(`Sunt necesare cel puțin ${D} echipe.`);
    c.ko = {rounds: bracketFromSeeds(c, st.slice(0, D)), built: Date.now()};
  }
}
function wcThirds(c){
  const G = c.groups.length, adv = +c.settings.advance;
  if (+c.settings.thirds >= 0) return Math.min(G, +c.settings.thirds);
  const q = G * adv, p = nextPow2(q); return Math.min(G, p - q);
}
function wcQualifiers(c){
  const adv = +c.settings.advance, tabs = {}; c.groups.forEach(g => tabs[g.id] = groupTable(c, g.id));
  const rank = rows => rows.sort((a, b) => b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || b.W - a.W);
  const seeds = [];
  for (let p = 0; p < adv; p++) seeds.push(...rank(c.groups.map(g => tabs[g.id][p] && {...tabs[g.id][p], grp: g.id, place: p + 1}).filter(Boolean)));
  const nT = wcThirds(c);
  const thirds = rank(c.groups.map(g => tabs[g.id][adv] && {...tabs[g.id][adv], grp: g.id, place: adv + 1}).filter(Boolean));
  thirds.forEach((r, i) => r.q = i < nT);
  seeds.push(...thirds.slice(0, nT));
  return {seeds, thirds, tabs};
}
function wcBuildKO(c){
  const {seeds} = wcQualifiers(c);
  if (seeds.length < 2) throw new Error('Nu sunt destule echipe calificate.');
  const grp = {}; seeds.forEach(s => grp[s.id] = s.grp);
  c.ko = {rounds: bracketFromSeeds(c, seeds.map(s => s.id), (a, b) => grp[a] === grp[b]), built: Date.now()};
}
function leagueBuildPO(c){
  const s = c.settings, t1 = divTable(c, 'd1'), t2 = divTable(c, 'd2');
  const k = Math.min(+s.relegPlayoff, +s.promoPlayoff);
  if (!k) throw new Error('Regulamentul nu prevede baraj.');
  const ties = [];
  for (let i = 0; i < k; i++){
    const A = t1[t1.length - +s.relegDirect - 1 - i], B = t2[+s.promoDirect + i];
    if (!A || !B) throw new Error('Nu sunt destule echipe pentru baraj.');
    ties.push({id: uid(), a: {t: A.id}, b: {t: B.id}, legs: +s.playoffLegs});
  }
  c.ko = {rounds: [{key: 'baraj', name: 'Baraj promovare / menținere', legs: +s.playoffLegs, ties}], built: Date.now()};
}
function allTies(c){ return c.ko ? c.ko.rounds.flatMap(r => r.ties.map(t => ({...t, _r: r}))) : []; }
function findTie(c, id){ if (!c.ko) return null; for (const r of c.ko.rounds) for (const t of r.ties) if (t.id === id) return {tie: t, round: r}; return null; }
function slotTeam(c, s, depth = 0){
  if (!s || depth > 20) return null; if (s.t) return c.teams[s.t] ? s.t : null;
  if (s.w || s.l){ const f = findTie(c, s.w || s.l); if (!f) return null; const st = tieState(c, f.tie, depth + 1); return s.w ? st.winner : st.loser; }
  return null;
}
function tieState(c, tie, depth = 0){
  const bye = !!((tie.a && tie.a.bye) || (tie.b && tie.b.bye));
  const A = slotTeam(c, tie.a, depth), B = slotTeam(c, tie.b, depth);
  const list = ms(c).filter(m => m.tie === tie.id).sort((a, b) => (a.leg || 0) - (b.leg || 0));
  const st = {A, B, ga: 0, gb: 0, pa: null, pb: null, ms: list, bye, winner: null, loser: null, started: false, done: false};
  if (bye){ st.winner = A || B; st.done = !!st.winner; return st; }
  const legs = +tie.legs || 1;
  list.forEach(m => { if (!m.played) return; st.started = true;
    if (m.home === A && m.away === B){ st.ga += m.hs; st.gb += m.as; } else if (m.home === B && m.away === A){ st.ga += m.as; st.gb += m.hs; } });
  const all = A && B && list.length >= legs && list.slice(0, legs).every(m => m.played);
  const last = list[legs - 1];
  if (last && last.played && last.ph != null && last.pa != null){ if (last.home === A){ st.pa = last.ph; st.pb = last.pa; } else { st.pa = last.pa; st.pb = last.ph; } }
  if (tie.manual && (tie.manual === A || tie.manual === B)) st.winner = tie.manual;
  else if (all){
    if (st.ga !== st.gb) st.winner = st.ga > st.gb ? A : B;
    else if (st.pa != null && st.pa !== st.pb) st.winner = st.pa > st.pb ? A : B;
    else st.needPens = true;
  }
  if (st.winner){ st.loser = st.winner === A ? B : A; st.done = true; }
  return st;
}
// creează / actualizează meciurile eliminatorii pentru dublele cu ambele echipe cunoscute
function ensureKO(c){
  const created = [], changed = [], removed = [];
  if (!c.ko) return {created, changed, removed};
  const stage = c.type === 'league' ? 'playoff' : 'ko';
  c.ko.rounds.forEach((r, ri) => r.ties.forEach(tie => {
    const st = tieState(c, tie);
    if (st.bye) return;
    const legs = +tie.legs || 1;
    if (!st.A || !st.B){ st.ms.filter(m => !m.played).forEach(m => { delete c.matches[m.id]; removed.push(m.id); }); return; }
    for (let leg = 1; leg <= legs; leg++){
      const home = legs === 2 ? (leg === 1 ? st.B : st.A) : st.A, away = home === st.A ? st.B : st.A;
      const m = st.ms.find(x => (x.leg || 1) === leg);
      const lbl = r.name + (legs === 2 ? ` · manșa ${leg}` : '');
      if (!m) created.push(newMatch(c, {stage, tie: tie.id, leg, round: ri + 1, rlabel: lbl, home, away, neutral: r.key === 'r2' && legs === 1}));
      else if (!m.played && (m.home !== home || m.away !== away)){ m.home = home; m.away = away; changed.push(m); }
    }
  }));
  return {created, changed, removed};
}
function koChampion(c){
  if (!c.ko) return null; const fin = c.ko.rounds.filter(r => !r.third && !r.playoff).slice(-1)[0];
  if (!fin || fin.ties.length !== 1 || c.type === 'league') return null;
  return tieState(c, fin.ties[0]).winner;
}

/* ---------------- statistici ---------------- */
function scorerList(c, filter = () => true){
  const S = {};
  ms(c).filter(m => m.played && filter(m)).forEach(m => {
    [['h', m.home], ['a', m.away]].forEach(([k, tid]) => (m.sc[k] || []).forEach(s => {
      const name = String(s.n || '').trim(); if (!name) return;
      const key = tid + '|' + name.toLowerCase();
      S[key] = S[key] || {name, tid, g: 0, m: new Set()}; S[key].g += (+s.g || 1); S[key].m.add(m.id);
    }));
  });
  return Object.values(S).map(s => ({...s, mp: s.m.size})).sort((a, b) => b.g - a.g || a.mp - b.mp || a.name.localeCompare(b.name));
}
function compStats(c){
  const pl = ms(c).filter(m => m.played);
  const goals = sum(pl, m => m.hs + m.as);
  const st = {played: pl.length, goals, avg: pl.length ? goals / pl.length : 0,
    homeW: pl.filter(m => m.hs > m.as).length, draws: pl.filter(m => m.hs === m.as).length, awayW: pl.filter(m => m.hs < m.as).length};
  st.all = table(c, teams(c).map(t => t.id), pl, {mode: 'gd'});
  st.biggest = [...pl].sort((a, b) => Math.abs(b.hs - b.as) - Math.abs(a.hs - a.as) || (b.hs + b.as) - (a.hs + a.as)).slice(0, 6);
  st.highest = [...pl].sort((a, b) => (b.hs + b.as) - (a.hs + a.as) || mOrder(a, b)).slice(0, 6);
  // serii
  const streak = {};
  teams(c).forEach(t => {
    const list = pl.filter(m => m.home === t.id || m.away === t.id).sort(mOrder);
    let un = 0, bestUn = 0, w = 0, bestW = 0;
    list.forEach(m => { const gf = m.home === t.id ? m.hs : m.as, ga = m.home === t.id ? m.as : m.hs;
      if (gf >= ga){ un++; bestUn = Math.max(bestUn, un); } else un = 0;
      if (gf > ga){ w++; bestW = Math.max(bestW, w); } else w = 0; });
    streak[t.id] = {bestUn, bestW, curUn: un, curW: w};
  });
  st.streak = streak;
  return st;
}

  const upcoming = ms(c).filter(m => !m.played).sort((a, b) => stageRank(a) - stageRank(b) || mOrder(a, b)).slice(0, 6);

  else if (c.type === 'league') side = ['d1', 'd2'].map(d => snapCard('ov-' + d, `${ic('table')}${esc(c.settings[d === 'd1' ? 'div1' : 'div2'])} — top 5`, tableHTML(c, divTable(c, d).slice(0, 5), {zone: leagueZone(c, d), compact: true}), {title: c.settings[d === 'd1' ? 'div1' : 'div2']})).join('<div style="height:18px"></div>');
  else side = c.groups.length ? snapCard('ov-gr', `${ic('table')}Liderii grupelor`, `<div class="lead">${c.groups.map(g => { const r = groupTable(c, g.id)[0]; return `<div class="li"><span class="pos">${esc(g.id)}</span>${r ? teamHTML(c, r.id, {s: 24}) : '<span class="dim">—</span>'}<span class="v">${r ? r.Pts : ''}</span></div>`; }).join('')}</div>`, {title: 'Liderii grupelor'}) : '';
  const sc = scorerList(c).slice(0, 5);
  h += `<div class="grid g21"><div class="grid" style="align-content:start">
    ${snapCard('ov-next', `${ic('clock')}Următoarele meciuri`, upcoming.length ? `<div class="mlist">${upcoming.map(m => matchRow(c, m, {meta: true})).join('')}</div>` : emptyBox('cal', 'Niciun meci programat.'), {title: 'Următoarele meciuri'})}
    ${snapCard('ov-last', `${ic('check')}Ultimele rezultate`, recent.length ? `<div class="mlist">${recent.map(m => matchRow(c, m, {meta: true, ro: true})).join('')}</div>` : emptyBox('ball', 'Încă nu s-a jucat niciun meci.'), {title: 'Ultimele rezultate'})}

const kpi = (v, l, sub = '') => `<div class="card kpi"><span class="v">${v}</span><span class="l">${l}</span>${sub}</div>`;
const stageRank = m => ({league: 0, group: 0, playoff: 1, ko: 1})[m.stage] || 0;

/* ---------- meci ---------- */
function roundLabel(c, m){

}

  let score;

  else if (edit) score = `<div class="score" data-mid="${m.id}"><input inputmode="numeric" type="number" min="0" data-k="hs" aria-label="goluri gazde"><span class="dim">:</span><input inputmode="numeric" type="number" min="0" data-k="as" aria-label="goluri oaspeți"></div>`;
  else score = `<div class="score"><span class="vs">${m.date ? esc(fmtDay(m.date)) : 'vs'}</span></div>`;
  const chips = [];
  if (o.meta){ chips.push(`<span class="chip">${esc(roundLabel(c, m))}</span>`); }
  if (m.stage === 'group' && (o.meta || o.grp)) chips.push(`<span class="chip acc">Gr. ${esc(m.group)}</span>`);
  if (m.stage === 'league' && c.type === 'league' && o.meta) chips.push(`<span class="chip">${esc(c.settings[m.div === 'd1' ? 'div1' : 'div2'])}</span>`);
  if (m.date && m.played && !o.meta) chips.push(`<span class="chip hide-sm">${esc(fmtDay(m.date))}</span>`);
  const nsc = (m.sc.h.length + m.sc.a.length);
  return `<div class="match">
    <div class="h">${teamHTML(c, m.home, {s: 30})}</div>${score}<div>${teamHTML(c, m.away, {s: 30})}</div>

      ${edit ? `${!m.played ? `<button class="ib" title="Salvează scorul" data-act="quickSave" data-id="${m.id}">${ic('check')}</button>` : ''}<button class="ib" title="Detalii / editare" data-act="editMatch" data-id="${m.id}">${ic('edit', 16)}</button>` : (!nsc ? `<button class="ib" title="Detalii" data-act="viewMatch" data-id="${m.id}">${ic('eye', 16)}</button>` : '')}</div>
  </div>`;
}

      ${o.grpSel ? `<select class="in sm" data-chg="teamGroup" data-id="${t.id}">${c.groups.map(g => `<option value="${g.id}" ${t.group === g.id ? 'selected' : ''}>Gr. ${esc(g.id)}</option>`).join('')}</select>` : ''}
      <button class="ib" title="Editează" data-act="editTeam" data-id="${t.id}">${ic('edit', 16)}</button><button class="ib danger" title="Șterge" data-act="delTeam" data-id="${t.id}">${ic('trash', 16)}</button>` : ''}</div></div>`;

}

  if (c.type === 'league'){

    return h;
  }
  const nP = c.type === 'ucl' ? c.settings.matchesPerTeam / 2 : c.settings.groupSize;
  const drawn = c.type === 'ucl' ? c.plan.length > 0 : c.groups.length > 0;
  const played = ms(c).some(m => m.played && (m.stage === 'league' || m.stage === 'group'));
  if (e){
    let info = '';
    if (c.type === 'ucl'){
      const N = all.length, M = c.settings.matchesPerTeam, S = N / nP;
      const ok = Number.isInteger(S) && S >= 3 && Array.from({length: nP}, (_, i) => all.filter(t => +t.pot === i + 1).length).every(x => x === S);
      info = N < M + 1 ? `<span class="chip bad">Minim ${M + 1} echipe pentru ${M} meciuri/echipă</span>` : ok ? `<span class="chip ok">${nP} urne × ${S} echipe — tragere exactă UCL</span>` : `<span class="chip warn">Urne inegale → tragere echilibrată (fiecare echipă tot ${M} meciuri, ${M / 2} acasă / ${M / 2} deplasare)</span>`;
    } else {
      const G = wcGroupCount(c); info = `<span class="chip ok">${G} grupe × ~${Math.ceil(all.length / G)} echipe</span><span class="chip">${G * c.settings.advance} calificate direct${wcThirdsPreview(c)}</span>`;
    }
    h += `<div class="card" style="margin-bottom:18px"><h3>${ic('shuffle')}Tragere la sorți<span class="sp"></span>${drawn ? '<span class="chip ok">Efectuată</span>' : '<span class="chip warn">Neefectuată</span>'}</h3>
      <div class="row" style="margin-bottom:12px">${info}</div>

      <span class="sp"></span><button class="btn primary" data-act="doDraw" ${played ? 'disabled title="S-au jucat deja meciuri"' : ''}>${ic('shuffle')}${drawn ? 'Refă tragerea la sorți' : (c.type === 'ucl' ? 'Trage la sorți faza ligii' : 'Trage la sorți grupele')}</button></div></div>`;

    const no = all.filter(t => !c.groups.some(g => g.id === t.group));

    return h;
  }
  const groups = Array.from({length: nP}, (_, i) => [i + 1, all.filter(t => +t.pot === i + 1)]);
  const none = all.filter(t => !(+t.pot >= 1 && +t.pot <= nP));
  h += `<div class="grid g2">${groups.map(([p, L]) => `<div class="card"><h3>${ic('layers')}Urna ${p}<span class="chip">${L.length}</span></h3><div class="mlist">${L.map(t => teamRow(c, t, {potSel: true})).join('') || '<div class="muted small">Goală</div>'}</div></div>`).join('')}</div>`;
  if (none.length) h += `<div class="card" style="margin-top:18px"><h3>Fără urnă<span class="chip warn">${none.length}</span></h3><div class="mlist">${none.map(t => teamRow(c, t, {potSel: true})).join('')}</div></div>`;
  return h;
}
function wcThirdsPreview(c){ const G = wcGroupCount(c), q = G * c.settings.advance; const th = +c.settings.thirds >= 0 ? Math.min(G, +c.settings.thirds) : Math.min(G, nextPow2(q) - q); return th ? ` + ${th} cele mai bune locuri ${+c.settings.advance + 1}` : ''; }

/* ---------- meciuri ---------- */
function phases(c){
  if (c.type === 'ucl') return [['league', 'Faza ligii'], ['ko', 'Eliminatorii']];
  if (c.type === 'wc') return [['group', 'Grupe'], ['ko', 'Eliminatorii']];
  return [['d1', c.settings.div1], ['d2', c.settings.div2], ['playoff', 'Baraj']];
}
function phaseFilter(c, ph){
  if (ph === 'league') return m => m.stage === 'league';
  if (ph === 'ko') return m => m.stage === 'ko';
  if (ph === 'group') return m => m.stage === 'group' && (!ui.mf.group || m.group === ui.mf.group);
  if (ph === 'd1' || ph === 'd2') return m => m.stage === 'league' && m.div === ph;
  if (ph === 'playoff') return m => m.stage === 'playoff';
  return () => true;
}
function viewMatches(c){
  const P = phases(c); const mf = ui.mf;
  if (!mf.phase) mf.phase = (c.ko && phaseProgress(c).done) ? (c.type === 'league' ? 'playoff' : 'ko') : P[0][0];
  const e = canEdit(c);
  let list = ms(c).filter(phaseFilter(c, mf.phase));
  const rounds = [...new Set(list.sort(mOrder).map(m => roundLabel(c, m)))];
  if (mf.round && !rounds.includes(mf.round)) mf.round = '';
  if (mf.team) list = list.filter(m => m.home === mf.team || m.away === mf.team);
  if (mf.status === 'todo') list = list.filter(m => !m.played); else if (mf.status === 'done') list = list.filter(m => m.played);
  if (mf.round) list = list.filter(m => roundLabel(c, m) === mf.round);
  let h = `<div class="ph"><div><h2>Meciuri</h2><p>${e ? 'Scrie scorul direct și apasă ✓ (sau Enter). Pentru marcatori, dată, penalty-uri sau neprezentare folosește butonul de editare.' : 'Programul și rezultatele competiției.'}</p></div>
    ${e ? `<button class="btn" data-act="addMatch">${ic('plus')}Meci manual</button>` : ''}</div>`;
  h += `<div class="row" style="margin-bottom:16px"><div class="seg">${P.map(([k, l]) => `<button class="${mf.phase === k ? 'on' : ''}" data-act="mf" data-k="phase" data-v="${k}">${esc(l)}</button>`).join('')}</div>
    ${mf.phase === 'group' && c.groups.length ? `<select class="in sm" data-chg="mf" data-k="group"><option value="">Toate grupele</option>${c.groups.map(g => `<option value="${g.id}" ${mf.group === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>` : ''}
    <select class="in sm" data-chg="mf" data-k="round"><option value="">Toate etapele</option>${rounds.map(r => `<option ${mf.round === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
    <select class="in sm" data-chg="mf" data-k="team"><option value="">Toate echipele</option>${teams(c).map(t => `<option value="${t.id}" ${mf.team === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
    <div class="seg">${[['', 'Toate'], ['todo', 'De jucat'], ['done', 'Jucate']].map(([k, l]) => `<button class="${(mf.status || '') === k ? 'on' : ''}" data-act="mf" data-k="status" data-v="${k}">${l}</button>`).join('')}</div></div>`;
  if (e) h += genPanel(c, mf.phase);
  if (!list.length) return h + emptyBox('cal', 'Niciun meci pentru filtrul ales.');
  const by = {}; list.sort(mOrder).forEach(m => { const k = roundLabel(c, m); (by[k] = by[k] || []).push(m); });
  const pool = (mf.phase === 'd1' || mf.phase === 'd2') ? poolsOf(c).find(p => p.key === mf.phase) : null;
  h += Object.keys(by).map((k, i) => {
    const L = by[k], done = L.filter(m => m.played).length;
    let bye = '';
    if (pool && !mf.team){ const busy = new Set(L.flatMap(m => [m.home, m.away])); const free = pool.ids.filter(id => !busy.has(id)); if (free.length && free.length < pool.ids.length) bye = `<div class="small muted" style="margin:-2px 0 8px">Stă etapa aceasta: ${free.map(id => esc(TM(c, id)?.name)).join(', ')}</div>`; }
    const id = 'rd-' + i;
    return snapCard(id, `${ic('cal')}${esc(k)}<span class="chip">${done}/${L.length}</span>`, bye + `<div class="mlist">${L.map(m => matchRow(c, m, {grp: mf.phase === 'group'})).join('')}</div>`, {title: k + (pool ? ' · ' + pool.name : ''), style: 'margin-bottom:16px'});
  }).join('');
  return h;
}
function genPanel(c, ph){
  if (c.status === 'incheiat') return '';

  if (ph === 'league' && c.type === 'ucl'){
    if (!c.plan.length) body = `<span class="muted">Tragerea la sorți a fazei ligii nu a fost efectuată.</span><span class="sp"></span><button class="btn primary" data-act="nav" data-to="${cpath(c, 'teams')}">${ic('shuffle')}Mergi la tragere</button>`;
    else { const pend = uclPendingPlan(c); const nr = new Set(pend.map(p => p.r)).size;
      body = pend.length ? `<span class="muted">${pend.length} meciuri în ${nr} etape rămase de generat (tragerea e făcută; le publici când vrei).</span><span class="sp"></span><button class="btn" data-act="gen" data-all="0">${ic('plus')}Generează etapa ${Math.min(...pend.map(p => p.r))}</button><button class="btn primary" data-act="gen" data-all="1">${ic('bolt')}Generează toate</button>` : `<span class="chip ok">${ic('check', 13)}Toate etapele fazei ligii sunt generate</span>`; }
  } else if (ph === 'group' || ph === 'd1' || ph === 'd2'){
