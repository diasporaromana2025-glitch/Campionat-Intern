    else {
      const pend = sum(pools, p => sum(poolPending(c, p), r => r.length)); const nr = Math.max(0, ...pools.map(p => poolPending(c, p).length));
      body = pend ? `<span class="muted">${pend} meciuri rămase de generat (${nr} etape).</span><span class="sp"></span>
        <button class="btn" data-act="gen" data-all="0">${ic('plus')}Generează etapa următoare</button><button class="btn primary" data-act="gen" data-all="1">${ic('bolt')}Generează toate</button>
        ${c.type === 'league' ? `<button class="btn ghost" data-act="gen" data-all="1" data-both="1" title="Ambele ligi">Ambele ligi</button>` : ''}`
        : `<span class="chip ok">${ic('check', 13)}Toate meciurile sunt generate</span><span class="muted small">Dacă adaugi echipe noi, meciurile lor vor apărea aici pentru generare.</span>`;
    }
  } else if (ph === 'ko' || ph === 'playoff'){
    if (!c.ko) body = `<span class="muted">${ph === 'playoff' ? 'Barajul' : 'Tabloul eliminatoriu'} nu a fost creat.</span><span class="sp"></span><button class="btn primary" data-act="nav" data-to="${cpath(c, 'ko')}">${ic('trophy')}Mergi la ${ph === 'playoff' ? 'baraj' : 'eliminatorii'}</button>`;
    else body = `<span class="muted">Meciurile eliminatorii se creează pe măsură ce se cunosc echipele.</span><span class="sp"></span><button class="btn primary" data-act="genKO">${ic('bolt')}Generează meciurile disponibile</button>`;
  }
  return body ? `<div class="card nosnap" style="margin-bottom:16px;padding:12px 14px"><div class="row">${ic('bolt')}${body}</div></div>` : '';
}

/* ---------- clasamente ---------- */
function uclZone(c){ const D = +c.settings.direct, po = c.settings.playoff;
  return p => p <= D ? ['#22c55e', 'Calificare directă în ' + roundName(po ? 2 * D : D).toLowerCase()] : (po && p <= 3 * D) ? ['#3b82f6', 'Play-off eliminatoriu'] : ['#ef4444', 'Eliminată']; }
function leagueZone(c, d){
  const s = c.settings, n = teams(c).filter(t => t.div === d).length;
  if (d === 'd1') return p => p === 1 ? ['#f5c542', 'Campioană'] : p > n - s.relegDirect ? ['#ef4444', 'Retrogradare directă'] : p > n - s.relegDirect - s.relegPlayoff ? ['#f59e0b', 'Baraj de menținere'] : null;
  return p => p <= s.promoDirect ? ['#22c55e', 'Promovare directă'] : p <= +s.promoDirect + +s.promoPlayoff ? ['#f59e0b', 'Baraj de promovare'] : null;
}
function wcZone(c){ const adv = +c.settings.advance, th = wcThirds(c); return p => p <= adv ? ['#22c55e', 'Calificată'] : (p === adv + 1 && th) ? ['#f59e0b', 'Posibilă calificare (cele mai bune locuri ' + (adv + 1) + ')'] : null; }
function tableHTML(c, rows, o = {}){
  if (!rows.length) return `<div class="muted small">Nicio echipă.</div>`;
  const z = o.zone || (() => null), cp = o.compact;
  const legend = {};
  const body = rows.map((r, i) => {
    const zz = z(r.pos, r); if (zz) legend[zz[1]] = zz[0];
    const prev = i ? z(rows[i - 1].pos, rows[i - 1]) : null;
    const sep = i && (prev ? prev[0] : '') !== (zz ? zz[0] : '') ? 'sep' : '';
    return `<tr class="${sep}"><td class="zone"><i style="background:${zz ? zz[0] : 'transparent'}"></i></td><td class="c"><span class="pos">${r.pos}</span></td>
      <td style="max-width:260px">${teamHTML(c, r.id, {s: 26, sub: !cp})}</td><td class="c">${r.P}</td>
      ${cp ? '' : `<td class="c hide-sm">${r.W}</td><td class="c hide-sm">${r.D}</td><td class="c hide-sm">${r.L}</td><td class="c hide-sm">${r.GF}</td><td class="c hide-sm">${r.GA}</td>`}
      <td class="c">${sign(r.GD)}</td><td class="c"><span class="pts">${r.Pts}</span>${r.ded ? `<sup class="dim" title="Penalizare −${r.ded}">*</sup>` : ''}</td>
      ${cp || o.noForm ? '' : `<td class="hide-sm"><span class="form">${r.form.map(f => `<b class="${f}">${f === 'W' ? 'V' : f === 'D' ? 'E' : 'Î'}</b>`).join('')}</span></td>`}</tr>`;
  }).join('');
  const lg = Object.keys(legend).length && !o.noLegend ? `<div class="legend">${Object.entries(legend).map(([l, col]) => `<span><i style="background:${col}"></i>${esc(l)}</span>`).join('')}${rows.some(r => r.ded) ? '<span>* penalizare de puncte</span>' : ''}</div>` : '';
  return `<div class="tw"><table class="tbl"><thead><tr><th class="zone"></th><th class="c">#</th><th>Echipă</th><th class="c">MJ</th>${cp ? '' : '<th class="c hide-sm">V</th><th class="c hide-sm">E</th><th class="c hide-sm">Î</th><th class="c hide-sm">GM</th><th class="c hide-sm">GP</th>'}<th class="c">GD</th><th class="c">Pct</th>${cp || o.noForm ? '' : '<th class="hide-sm">Formă</th>'}</tr></thead><tbody>${body}</tbody></table></div>${lg}`;
}
const venueSeg = () => `<div class="seg nosnap">${[['all', 'Total'], ['home', 'Acasă'], ['away', 'Deplasare']].map(([k, l]) => `<button class="${ui.tableView === k ? 'on' : ''}" data-act="tview" data-v="${k}">${l}</button>`).join('')}</div>`;
function viewTable(c){
  const V = ui.tableView;
  let h = `<div class="ph"><div><h2>${c.type === 'ucl' ? 'Clasamentul fazei ligii' : c.type === 'wc' ? 'Clasamentele grupelor' : 'Clasamente'}</h2><p>Departajare: ${esc(TB_LABEL[c.settings.tiebreak] || '')}.</p></div>${venueSeg()}</div>`;
  if (c.type === 'ucl'){
    h += snapCard('tbl-ucl', `${ic('table')}Faza ligii${V !== 'all' ? ` · ${V === 'home' ? 'acasă' : 'deplasare'}` : ''}`, tableHTML(c, uclTable(c, V), {zone: V === 'all' ? uclZone(c) : null}), {title: 'Clasament faza ligii'});
  } else if (c.type === 'league'){
    h += ['d1', 'd2'].map(d => { const nm = c.settings[d === 'd1' ? 'div1' : 'div2'];
      return snapCard('tbl-' + d, `${ic('layers')}${esc(nm)}${V !== 'all' ? ` · ${V === 'home' ? 'acasă' : 'deplasare'}` : ''}`, tableHTML(c, divTable(c, d, V), {zone: V === 'all' ? leagueZone(c, d) : null}), {title: 'Clasament ' + nm, style: 'margin-bottom:18px'}); }).join('');
  } else {
    if (!c.groups.length) return h + emptyBox('globe', 'Grupele nu au fost trase la sorți încă.');
    h += `<div class="grid g2">${c.groups.map(g => snapCard('tbl-g' + g.id, `${ic('globe')}${esc(g.name)}`, tableHTML(c, groupTable(c, g.id, V), {zone: V === 'all' ? wcZone(c) : null, noForm: true}), {title: g.name})).join('')}</div>`;
    const nT = wcThirds(c);
    if (nT && V === 'all'){
      const {thirds} = wcQualifiers(c); const adv = +c.settings.advance;
      const rows = thirds.map((r, i) => ({...r, pos: i + 1}));
      h += `<div style="height:18px"></div>` + snapCard('tbl-thirds', `${ic('medal')}Clasamentul locurilor ${adv + 1} <span class="chip">${nT} se califică</span>`, tableHTML(c, rows, {zone: p => p <= nT ? ['#22c55e', 'Calificată'] : ['#ef4444', 'Eliminată'], noForm: true}), {title: 'Clasamentul locurilor ' + (adv + 1)});
    }
  }
  return h;
}

/* ---------- eliminatorii ---------- */
function tieCard(c, tie, r){
  const st = tieState(c, tie);
  const slotLbl = s => s && s.w ? 'Câștigătoarea dublei anterioare' : s && s.l ? 'Învinsa din semifinală' : 'De stabilit';
  const row = (tid, g, p, slot) => {
    const cls = st.winner ? (st.winner === tid ? 'win' : 'lose') : '';
    return `<div class="tr ${cls}">${tid ? teamHTML(c, tid, {s: 24, sub: false}) : (slot && slot.bye ? '<div class="team"><b class="dim">— liberă —</b></div>' : `<div class="team">${logoHTML(null, 24)}<div class="nm"><b class="dim small">${slotLbl(slot)}</b></div></div>`)}
      <span class="g">${st.started ? g : ''}${p != null ? `<small class="dim" style="font-size:11px"> (${p})</small>` : ''}</span></div>`;
  };
  const legs = st.ms.filter(m => m.played).map(m => `${m.hs}-${m.as}`).join(', ');
  const parts = [];
  if (legs && tie.legs === 2) parts.push('Manșe: ' + legs);
  if (st.pa != null) parts.push(`pen. ${st.pa}-${st.pb}`);
  if (st.needPens) parts.push('<span style="color:var(--warn)">egal: lipsesc penalty-urile</span>');
  const foot = st.bye ? 'Calificare directă' : st.ms.length ? (legs ? parts.join(' · ') : (st.ms[0].date ? fmtDay(st.ms[0].date) : 'Meci programat')) : (st.A && st.B ? 'Meci negenerat' : '');
  return `<div class="tie ${r.key === 'r2' ? 'final' : ''} clk" data-act="openTie" data-id="${tie.id}">${row(st.A, st.ga, st.pa, tie.a)}${row(st.B, st.gb, st.pb, tie.b)}${foot ? `<div class="foot"><span>${foot}</span><span>${tie.legs === 2 ? 'tur-retur' : '1 meci'}</span></div>` : ''}</div>`;
}
function viewKO(c){
  if (c.type === 'league') return viewLeagueEnd(c);
  const e = canEdit(c), pr = phaseProgress(c);
  let h = `<div class="ph"><div><h2>Faza eliminatorie</h2><p>${c.type === 'ucl' ? `Locurile 1–${c.settings.direct} merg direct în ${roundName(c.settings.playoff ? 2 * c.settings.direct : c.settings.direct).toLowerCase()}${c.settings.playoff ? `, locurile ${+c.settings.direct + 1}–${3 * c.settings.direct} joacă play-off (capii de serie ${+c.settings.direct + 1}–${2 * c.settings.direct} joacă returul acasă)` : ''}. Tabloul e fix până în finală, ca în UCL.` : 'Câștigătoarele de grupă întâlnesc echipe de pe locurile 2/3 din alte grupe; tabloul evită meciurile între echipe din aceeași grupă în primul tur.'}</p></div>
    ${e && c.ko ? `<div class="row"><button class="btn" data-act="genKO">${ic('bolt')}Generează meciurile</button><button class="btn danger" data-act="buildKO">${ic('undo')}Refă tabloul</button></div>` : ''}</div>`;
  if (!c.ko){
    h += pr.done ? `<div class="banner ok">${ic('check')}Faza principală s-a încheiat. Tabloul poate fi creat.</div>` : `<div class="banner">${ic('info')}Faza principală nu s-a încheiat (${pr.played}/${pr.total} meciuri). Poți crea tabloul oricum — se folosește clasamentul curent.</div>`;
    if (c.type === 'wc' && c.groups.length){
      const {seeds} = wcQualifiers(c);
      h += `<div class="card" style="margin-bottom:18px"><h3>${ic('users')}Echipe calificate (${seeds.length})</h3><div class="grid gauto">${seeds.map((s, i) => `<div class="row"><span class="pos">${i + 1}</span>${teamHTML(c, s.id, {s: 24})}<span class="chip">${s.place}${esc(s.grp)}</span></div>`).join('')}</div></div>`;
    }
    return h + (e ? `<div class="row"><button class="btn primary lg" data-act="buildKO">${ic('trophy')}Creează tabloul eliminatoriu</button></div>` : emptyBox('trophy', 'Tabloul eliminatoriu nu a fost creat încă.'));
  }
  const ch = koChampion(c); if (ch) h += champBox(c, ch, 'Câștigătoarea ' + c.name);
  const main = c.ko.rounds.filter(r => !r.third), third = c.ko.rounds.find(r => r.third);
  const cols = main.map(r => `<div class="bcol"><h4>${esc(r.name)}</h4>${r.ties.map(t => tieCard(c, t, r)).join('')}${r.key === 'r2' && third ? `<h4 style="margin-top:18px">${esc(third.name)}</h4>${third.ties.map(t => tieCard(c, t, third)).join('')}` : ''}</div>`).join('');
  h += snapCard('bracket', `${ic('trophy')}Tabloul eliminatoriu`, `<div class="bracket">${cols}</div>`, {title: 'Tabloul eliminatoriu'});
  return h;
}
function viewLeagueEnd(c){
  const s = c.settings, e = canEdit(c), pr = phaseProgress(c);
  const t1 = divTable(c, 'd1'), t2 = divTable(c, 'd2');
  let h = `<div class="ph"><div><h2>Baraj & finalul sezonului</h2><p>${esc(s.div1)}: ultimele ${s.relegDirect} retrogradează direct, ${s.relegPlayoff ? `următoarea${s.relegPlayoff > 1 ? 'le ' + s.relegPlayoff : ''} joacă baraj` : 'fără baraj'}. ${esc(s.div2)}: primele ${s.promoDirect} promovează direct${s.promoPlayoff ? `, locul ${+s.promoDirect + 1}${s.promoPlayoff > 1 ? '–' + (+s.promoDirect + +s.promoPlayoff) : ''} joacă baraj` : ''}.</p></div></div>`;
  if (!pr.done) h += `<div class="banner">${ic('info')}Sezonul regulat nu s-a încheiat (${pr.played}/${pr.total} meciuri). Situația de mai jos e provizorie.</div>`;
  const champ = t1[0], rel = t1.slice(Math.max(0, t1.length - s.relegDirect)), pro = t2.slice(0, s.promoDirect);
  const list = (rows, chipC) => rows.length ? rows.map(r => `<div class="row" style="margin-bottom:8px">${teamHTML(c, r.id, {s: 30})}<span class="sp"></span><span class="chip ${chipC}">${r.Pts} pct</span></div>`).join('') : '<div class="muted small">—</div>';
  h += `<div class="grid g3" style="margin-bottom:18px">
    ${snapCard('end-ch', `${ic('trophy')}Campioana ${esc(s.div1)}`, champ ? `<div class="row">${logoHTML(TM(c, champ.id), 56)}<div><div style="font-weight:850;font-size:18px">${esc(TM(c, champ.id).name)}</div><div class="muted">${champ.Pts} puncte · ${champ.W}V ${champ.D}E ${champ.L}Î</div></div></div>` : '—', {title: 'Campioana'})}
    ${snapCard('end-up', `${ic('arrowUp')}Promovează din ${esc(s.div2)}`, list(pro, 'ok'), {title: 'Promovate'})}
    ${snapCard('end-down', `${ic('arrowDown')}Retrogradează din ${esc(s.div1)}`, list(rel, 'bad'), {title: 'Retrogradate'})}</div>`;
  if (!c.ko){
    if (Math.min(s.relegPlayoff, s.promoPlayoff) > 0){
      const k = Math.min(s.relegPlayoff, s.promoPlayoff); const prev = [];
      for (let i = 0; i < k; i++){ const A = t1[t1.length - s.relegDirect - 1 - i], B = t2[+s.promoDirect + i]; if (A && B) prev.push([A.id, B.id]); }
      h += `<div class="card" style="margin-bottom:18px"><h3>${ic('swap')}Baraj (previzionat)</h3>${prev.map(([a, b]) => `<div class="match" style="grid-template-columns:1fr auto 1fr"><div class="h">${teamHTML(c, a)}</div><span class="vs dim">vs</span><div>${teamHTML(c, b)}</div></div>`).join('') || '<div class="muted">—</div>'}
        ${e ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-act="buildKO">${ic('swap')}Creează barajul</button><span class="muted small">Echipa din ${esc(s.div1)} joacă returul acasă${s.playoffLegs == 1 ? ' (meci unic pe terenul ei)' : ''}.</span></div>` : ''}</div>`;
    }
  } else {
    h += snapCard('baraj', `${ic('swap')}Baraj`, `<div class="grid gauto">${c.ko.rounds[0].ties.map(t => tieCard(c, t, c.ko.rounds[0])).join('')}</div>`, {title: 'Baraj', tools: e ? `<button class="btn sm nosnap" data-act="genKO">${ic('bolt')}Generează meciuri</button><button class="btn sm danger nosnap" data-act="buildKO">Refă</button>` : '', style: 'margin-bottom:18px'});
  }
  if (e) h += `<div class="card"><h3>${ic('zap')}Sezonul următor</h3><p class="muted" style="margin-top:0">Creează automat noul sezon: echipele promovate / retrogradate (inclusiv rezultatul barajului) sunt mutate în ligile corecte; logo-urile și datele echipelor se păstrează, iar sezonul curent rămâne în arhivă.</p>
    <button class="btn primary" data-act="newSeason">${ic('zap')}Începe sezonul următor</button></div>`;
  if (c.history.length) h += `<div class="card" style="margin-top:18px"><h3>${ic('clock')}Palmares</h3><div class="tw"><table class="tbl"><thead><tr><th>Sezon</th><th>Campioană ${esc(s.div1)}</th><th>Câștigătoare ${esc(s.div2)}</th><th>Promovate</th><th>Retrogradate</th></tr></thead><tbody>${c.history.map(x => `<tr><td>${esc(x.season)}</td><td><b>${esc(x.champ)}</b></td><td>${esc(x.champ2 || '')}</td><td>${esc((x.up || []).join(', '))}</td><td>${esc((x.down || []).join(', '))}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}

/* ---------- statistici ---------- */
function scorerTable(c, list){
  return `<div class="tw"><table class="tbl"><thead><tr><th class="c">#</th><th>Jucător</th><th>Echipă</th><th class="c">Meciuri</th><th class="c">Goluri</th></tr></thead><tbody>${list.map((s, i) => `<tr><td class="c"><span class="pos">${i + 1}</span></td><td><b>${esc(s.name)}</b></td><td>${teamHTML(c, s.tid, {s: 22, sub: false})}</td><td class="c">${s.mp}</td><td class="c"><span class="pts">${s.g}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function leaderCard(c, id, title, icon, rows, val, fmt = v => v){
  return snapCard(id, `${ic(icon)}${title}`, `<div class="lead">${rows.slice(0, 6).map((r, i) => `<div class="li"><span class="pos">${i + 1}</span>${teamHTML(c, r.id, {s: 26})}<span class="v">${fmt(val(r))}</span></div>`).join('') || '<div class="muted small">—</div>'}</div>`, {title});
}
function viewStats(c){
  const st = compStats(c), tab = ui.statsTab;
  let h = `<div class="ph"><div><h2>Statistici</h2><p>Toate fazele competiției, actualizate live.</p></div></div>`;
  h += `<div class="grid g4" style="margin-bottom:18px">${kpi(st.played, 'Meciuri')}${kpi(st.goals, 'Goluri')}${kpi(st.avg.toFixed(2), 'Medie / meci')}${kpi(`${st.homeW}<span class="dim" style="font-size:18px"> / ${st.draws} / ${st.awayW}</span>`, '1 / X / 2')}</div>`;
  h += `<div class="tabs">${[['scorers', 'Golgheteri'], ['teams', 'Echipe'], ['matches', 'Meciuri'], ['form', 'Formă & serii']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="stab" data-v="${k}">${l}</button>`).join('')}</div>`;
  const rows = st.all.filter(r => r.P > 0);
  if (tab === 'scorers'){
    const sc = scorerList(c);
    h += snapCard('st-sc', `${ic('fire')}Golgheterii competiției`, sc.length ? scorerTable(c, sc.slice(0, 30)) : emptyBox('ball', 'Nu există marcatori introduși. Adaugă-i din editarea fiecărui meci.'), {title: 'Golgheteri'});
  } else if (tab === 'teams'){
    if (!rows.length) return h + emptyBox('chart', 'Statisticile apar după primele rezultate.');
    const avg = (r, k) => r.P ? r[k] / r.P : 0;
    h += `<div class="grid g3">
      ${leaderCard(c, 'st-att', 'Cel mai bun atac', 'fire', [...rows].sort((a, b) => b.GF - a.GF || a.P - b.P), r => r.GF)}
      ${leaderCard(c, 'st-def', 'Cea mai bună apărare', 'shield', [...rows].sort((a, b) => a.GA - b.GA || b.P - a.P), r => r.GA)}
      ${leaderCard(c, 'st-gd', 'Cel mai bun golaveraj', 'chart', [...rows].sort((a, b) => b.GD - a.GD), r => r.GD, sign)}
      ${leaderCard(c, 'st-w', 'Cele mai multe victorii', 'trophy', [...rows].sort((a, b) => b.W - a.W || a.P - b.P), r => r.W)}
      ${leaderCard(c, 'st-cs', 'Meciuri fără gol primit', 'lock', [...rows].sort((a, b) => b.cs - a.cs), r => r.cs)}
      ${leaderCard(c, 'st-ppg', 'Puncte / meci', 'star', [...rows].sort((a, b) => avg(b, 'Pts') - avg(a, 'Pts')), r => avg(r, 'Pts'), v => v.toFixed(2))}
    </div><div style="height:18px"></div>`;
    const maxG = Math.max(1, ...rows.map(r => r.GF));
    h += snapCard('st-goals', `${ic('chart')}Goluri marcate pe echipă`, [...rows].sort((a, b) => b.GF - a.GF).map(r => `<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(TM(c, r.id).name)}</span><div class="b"><i style="width:${r.GF / maxG * 100}%"></i></div><b class="r">${r.GF}</b></div>`).join(''), {title: 'Goluri marcate pe echipă'});
    h += `<div style="height:18px"></div>` + snapCard('st-all', `${ic('table')}Clasament general (toate fazele)`, tableHTML(c, rows, {noLegend: true}), {title: 'Clasament general'});
  } else if (tab === 'matches'){
    const L = (id, t, list) => snapCard(id, `${ic('ball')}${t}`, list.length ? `<div class="mlist">${list.map(m => matchRow(c, m, {meta: true, ro: true})).join('')}</div>` : '<div class="muted small">—</div>', {title: t});
    h += `<div class="grid g2">${L('st-big', 'Cele mai mari victorii', st.biggest.filter(m => m.hs !== m.as))}${L('st-high', 'Cele mai spectaculoase meciuri', st.highest)}</div>`;
  } else {
    if (!rows.length) return h + emptyBox('chart', 'Statisticile apar după primele rezultate.');
    h += snapCard('st-form', `${ic('bolt')}Forma & seriile`, `<div class="tw"><table class="tbl"><thead><tr><th>Echipă</th><th>Ultimele 5</th><th class="c">Neînvinsă (acum)</th><th class="c">Victorii la rând (acum)</th><th class="c">Record neînvinsă</th><th class="c">Record victorii</th></tr></thead><tbody>
      ${[...rows].sort((a, b) => st.streak[b.id].curUn - st.streak[a.id].curUn || b.Pts - a.Pts).map(r => { const s = st.streak[r.id]; return `<tr><td>${teamHTML(c, r.id, {s: 24})}</td><td><span class="form">${r.form.map(f => `<b class="${f}">${f === 'W' ? 'V' : f === 'D' ? 'E' : 'Î'}</b>`).join('')}</span></td><td class="c b">${s.curUn}</td><td class="c b">${s.curW}</td><td class="c">${s.bestUn}</td><td class="c">${s.bestW}</td></tr>`; }).join('')}</tbody></table></div>`, {title: 'Forma & seriile'});
  }
  return h;
}

/* ---------- profil echipă ---------- */
function viewTeam(c){
  const t = TM(c, ui.route.id); if (!t) return emptyBox('users', 'Echipa nu există.');
  const list = ms(c).filter(m => m.home === t.id || m.away === t.id).sort((a, b) => stageRank(a) - stageRank(b) || mOrder(a, b));
  const r = table(c, [t.id], list.filter(m => m.played), {mode: 'gd'})[0];
  let pos = '';
  if (c.type === 'ucl'){ const x = uclTable(c).find(z => z.id === t.id); pos = x ? x.pos + '. în faza ligii' : ''; }

function rulesText(c){

  if (c.type === 'ucl') return [
    `<b>Faza ligii.</b> Toate echipele sunt într-un singur clasament. Fiecare echipă joacă ${s.matchesPerTeam} meciuri cu ${s.matchesPerTeam} adversari diferiți (${s.matchesPerTeam / 2} acasă, ${s.matchesPerTeam / 2} în deplasare): câte doi adversari din fiecare din cele ${s.matchesPerTeam / 2} urne, unul acasă și unul în deplasare.`,
    pts, `<b>Departajare:</b> ${TB_LABEL[s.tiebreak]}.`,
    `<b>Calificare:</b> locurile 1–${s.direct} direct în ${roundName(s.playoff ? 2 * s.direct : s.direct).toLowerCase()}.${s.playoff ? ` Locurile ${+s.direct + 1}–${3 * s.direct} joacă play-off eliminatoriu (${s.playoffLegs == 2 ? 'tur-retur' : 'meci unic'}): capii de serie ${+s.direct + 1}–${2 * s.direct} întâlnesc echipele de pe ${2 * s.direct + 1}–${3 * s.direct} și joacă returul acasă. Restul echipelor sunt eliminate.` : ''}`,
    `<b>Tabloul eliminatoriu</b> este stabilit după clasament (perechi ${s.pairDraw ? 'trase la sorți în cadrul perechilor de locuri, ca la UEFA' : 'fixe'}): locurile 1–2 întâlnesc câștigătoarele dublelor ${2 * s.direct}/${2 * s.direct + 1}, etc. Locurile 1 și 2 sunt în jumătăți opuse și se pot întâlni doar în finală.`,
    `<b>Eliminatorii:</b> ${s.koLegs == 2 ? 'tur-retur, echipa mai bine clasată joacă returul acasă' : 'meci unic'}; finala ${s.finalLegs == 2 ? 'tur-retur' : 'meci unic pe teren neutru'}. Fără regula golului în deplasare: la egalitate la general se joacă prelungiri și penalty-uri.`];
  if (c.type === 'wc') return [
    `<b>Faza grupelor.</b> Grupe de câte ${s.groupSize} echipe, ${s.groupLegs == 2 ? 'tur-retur' : 'fiecare cu fiecare, un singur meci'}. Echipele sunt distribuite din urne (câte una din fiecare urnă în fiecare grupă).`,

    `<b>Eliminatorii:</b> ${s.koLegs == 2 ? 'tur-retur' : 'meci unic'}; la egalitate prelungiri și penalty-uri. ${s.thirdPlace ? 'Se joacă finala mică pentru locul 3. ' : ''}Finala ${s.finalLegs == 2 ? 'tur-retur' : 'meci unic'}.`];
  return [
    `<b>Două ligi:</b> ${esc(s.div1)} și ${esc(s.div2)}. Numărul de echipe e liber (10, 11, 20…) și se pot adăuga echipe oricând, în oricare ligă. Cu număr impar de echipe, câte o echipă stă în fiecare etapă.`,
    `Fiecare echipă joacă cu fiecare din liga sa ${s.legs == 2 ? 'de două ori (tur-retur)' : s.legs == 1 ? 'o dată' : s.legs + ' ori'}.`, pts,
    `<b>Departajare:</b> ${TB_LABEL[s.tiebreak]}.`,
    `<b>${esc(s.div1)}:</b> ultimele ${s.relegDirect} echipe retrogradează direct${s.relegPlayoff ? `; echipa de pe locul ${s.relegDirect + 1} de la coadă joacă baraj` : ''}.`,
    `<b>${esc(s.div2)}:</b> primele ${s.promoDirect} promovează direct${s.promoPlayoff ? `; locul ${+s.promoDirect + 1} joacă baraj cu echipa de baraj din ${esc(s.div1)}` : ''}.`,
    `<b>Baraj:</b> ${s.playoffLegs == 2 ? 'tur-retur, echipa din ' + esc(s.div1) + ' joacă returul acasă' : 'meci unic'}; la egalitate penalty-uri. Câștigătoarea joacă sezonul următor în ${esc(s.div1)}.`];

function fld(label, inner, hint = ''){ return `<div class="fg"><label>${label}</label>${inner}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`; }
const numIn = (k, v, min = 0, max = 99) => `<input class="in" type="number" name="${k}" value="${v}" min="${min}" max="${max}">`;
const selIn = (k, v, opts) => `<select class="in" name="${k}">${opts.map(([a, b]) => `<option value="${a}" ${String(v) === String(a) ? 'selected' : ''}>${b}</option>`).join('')}</select>`;
const chk = (k, v, l) => `<label class="check"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}>${l}</label>`;
function settingsForm(c, typeOverride){

    ${fld('Grupe', selIn('groupLegs', s.groupLegs, [[1, 'Un meci'], [2, 'Tur-retur']]))}
    ${fld('Eliminatorii', selIn('koLegs', s.koLegs, [[1, 'Meci unic'], [2, 'Tur-retur']]))}
    ${fld('Finala', selIn('finalLegs', s.finalLegs, [[1, 'Meci unic'], [2, 'Tur-retur']]))}</div>${chk('thirdPlace', s.thirdPlace, 'Se joacă finala mică (locul 3)')}`;
  if (type === 'league') h += `<div class="grid g3">

    ${fld('Promovează direct (L2)', numIn('promoDirect', s.promoDirect))}${fld('Baraj promovare (L2)', numIn('promoPlayoff', s.promoPlayoff))}
    ${fld('Baraj', selIn('playoffLegs', s.playoffLegs, [[2, 'Tur-retur'], [1, 'Meci unic']]))}</div>`;
  h += chk('autoKO', s.autoKO, 'Creează automat meciurile eliminatorii când se cunosc echipele') + chk('showScorers', s.showScorers, 'Afișează marcatorii la meciuri');
  return h;
}
function readSettings(root, type){
  const s = {}; const D = {...DEFAULTS.common, ...DEFAULTS[type]};
  Object.keys(D).forEach(k => {
    const el = root.querySelector(`[name="${k}"]`); if (!el) return;
    if (el.type === 'checkbox') s[k] = el.checked;
    else if (typeof D[k] === 'boolean') s[k] = el.value === '1';
    else if (typeof D[k] === 'number') s[k] = numOr(el.value, D[k]);
    else s[k] = el.value.trim() || D[k];
  });
  return s;
}

function toast(msg, type = 'ok'){
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = (type === 'err' ? ic('info') : type === 'warn' ? ic('info') : ic('check')) + `<span>${esc(msg)}</span>`;
  const box = $('#toasts'); box.appendChild(t); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => t.remove(), type === 'err' ? 6500 : 3200);
}
function modal(title, body, o = {}){
  const w = document.createElement('div'); w.className = 'mb';
  w.innerHTML = `<div class="md ${o.wide || ''}"><div class="mh"><h3>${title}</h3><button class="ib" data-x>${ic('x')}</button></div><div class="mbd">${body}</div>
    ${o.foot === false ? '' : `<div class="mf">${o.extra || ''}<span class="sp"></span><button class="btn" data-x>${o.cancel || 'Anulează'}</button>${o.ok ? `<button class="btn ${o.danger ? 'danger' : 'primary'}" data-ok>${o.okText || 'Salvează'}</button>` : ''}</div>`}</div>`;
  $('#modal-root').appendChild(w);
  const close = () => { w.remove(); if (ui.pending && !$('.mb')){ ui.pending = false; render(); } };
  w.addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); });
  if (o.ok){ const b = w.querySelector('[data-ok]'); b.onclick = async () => { b.disabled = true; try { const r = await o.ok(w); if (r !== false) close(); } finally { b.disabled = false; } }; }
  const f = w.querySelector('input:not([type=hidden]):not([type=file]),select,textarea'); if (f && !o.noFocus) setTimeout(() => f.focus(), 60);
  if (o.onOpen) o.onOpen(w);
  return {el: w, close};
}
function confirmBox(msg, okText = 'Confirmă', danger = true){
  return new Promise(res => { let done = false;
    const m = modal('Confirmare', `<p style="margin:0;line-height:1.6">${msg}</p>`, {ok: () => { done = true; res(true); }, okText, danger, noFocus: true});
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)){ obs.disconnect(); if (!done) res(false); } });
    obs.observe($('#modal-root'), {childList: true}); });
}
function promptBox(title, label, val = '', o = {}){
  return new Promise(res => { let done = false;
    const m = modal(title, fld(label, `<input class="in" id="pIn" type="${o.type || 'text'}" value="${esc(val)}">`, o.hint || ''), {ok: w => { done = true; res(w.querySelector('#pIn').value); }, okText: o.okText || 'OK'});
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)){ obs.disconnect(); if (!done) res(null); } });
    obs.observe($('#modal-root'), {childList: true}); });
}
const need = c => { if (!canEdit(c)){ toast(isAdmin() ? 'Competiția este încheiată. Redeschide-o din Regulament.' : 'Doar administratorii pot modifica.', 'err'); return false; } return true; };

/* ---------------- autentificare ---------------- */
const passHash = p => sha256('fcm-comp|' + p);
function setAuth(id){ const a = DB.admins[id]; Object.assign(auth, {id, name: a.name, role: a.role, h: a.hash}); try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch {} }
function loginModal(){
  const list = Object.entries(DB.admins);
  if (!list.length) return setupAdmin();
  modal('Autentificare administrator', `${fld('Administrator', `<select class="in" id="lgU">${list.map(([id, a]) => `<option value="${id}">${esc(a.name)}</option>`).join('')}</select>`)}${fld('Parolă', '<input class="in" id="lgP" type="password" autocomplete="current-password">')}`,
    {okText: 'Intră', ok: w => {
      const id = w.querySelector('#lgU').value, p = w.querySelector('#lgP').value;
      if (!DB.admins[id] || DB.admins[id].hash !== passHash(p)){ toast('Parolă greșită', 'err'); return false; }
      setAuth(id); toast('Bine ai venit, ' + auth.name + '!'); render();
    }, onOpen: w => { const p = w.querySelector('#lgP'); setTimeout(() => p.focus(), 80); p.addEventListener('keydown', e => { if (e.key === 'Enter') w.querySelector('[data-ok]').click(); }); }});
}
function setupAdmin(){
  if (Object.keys(DB.admins).length) return loginModal();
  modal('Administrator principal', `<p class="muted" style="margin-top:0">Contul de administrator principal poate crea competiții și alți administratori.</p>
    ${fld('Nume', '<input class="in" id="saN" placeholder="ex: Sorin">')}${fld('Parolă', '<input class="in" id="saP" type="password" autocomplete="new-password">', 'Minim 4 caractere')}${fld('Confirmă parola', '<input class="in" id="saP2" type="password">')}`,
    {okText: 'Creează contul', ok: async w => {
      const n = w.querySelector('#saN').value.trim(), p = w.querySelector('#saP').value;
      if (!n || p.length < 4){ toast('Completează numele și o parolă de minim 4 caractere', 'err'); return false; }
      if (p !== w.querySelector('#saP2').value){ toast('Parolele nu coincid', 'err'); return false; }
      if (Object.keys(DB.admins).length){ toast('Există deja un administrator.', 'err'); return; }
      const id = uid(); DB.admins[id] = {name: n, hash: passHash(p), role: 'super', created: Date.now()};
      await Sync.set('admins/' + id, DB.admins[id]); setAuth(id); Sync.audit('A creat contul de administrator principal'); toast('Cont creat'); render();
    }});
}

      <div>${fld('Logo competiție', `<div class="logo-up"><div id="wzL">${compLogo({type: d.type, logo: d.logo}, 84)}</div><div class="row"><button class="btn" data-wz="logo">${ic('img')}Încarcă</button>${d.logo ? `<button class="btn ghost" data-wz="nologo">Elimină</button>` : ''}</div></div>`, 'PNG/JPG/WebP — se redimensionează automat.')}</div></div>`;

      const hint = 'O echipă pe linie. Opțional: <span class="kbd">Nume echipă | Jucător</span>. Poți adăuga echipe și mai târziu.';
      h += d.type === 'league' ? `<div class="grid g2">${fld(esc((d.settings || DEFAULTS.league).div1 || 'Liga 1'), `<textarea class="in" id="wzT1" style="min-height:240px" placeholder="Real Madrid | Andrei\nBarcelona | Mihai">${esc(d.t1)}</textarea>`, hint)}${fld(esc((d.settings || DEFAULTS.league).div2 || 'Liga 2'), `<textarea class="in" id="wzT2" style="min-height:240px">${esc(d.t2)}</textarea>`)}</div>`
        : fld('Echipe participante', `<textarea class="in" id="wzT1" style="min-height:260px" placeholder="Real Madrid | Andrei\nBarcelona | Mihai">${esc(d.t1)}</textarea>`, hint + (d.type === 'ucl' ? ' Ordinea contează pentru urne (primele = Urna 1).' : ' Ordinea contează pentru urne (primele = capi de serie).'));
    }
    h += `<div class="row" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">${d.step > 1 ? `<button class="btn" data-wz="back">${ic('back')}Înapoi</button>` : ''}<span class="sp"></span><button class="btn" data-x>Anulează</button>
      ${d.step < 4 ? `<button class="btn primary" data-wz="next">Continuă</button>` : `<button class="btn primary" data-wz="create">${ic('check')}Creează competiția</button>`}</div>`;
    W.innerHTML = h;
  };
  W.addEventListener('click', async e => {
    const b = e.target.closest('[data-wz]'); if (!b) return; const a = b.dataset.wz;
    if (a === 'type'){ d.type = b.dataset.v; d.settings = null; d.step = 2; d.name = ''; paint(); }
    if (a === 'back'){ readStep(); d.step--; paint(); }
    if (a === 'next'){ readStep(); d.step++; paint(); }
    if (a === 'logo'){ const f = await pickFile('image/*'); if (f){ readStep(); d.logo = await readImage(f, 256); paint(); } }
    if (a === 'nologo'){ readStep(); d.logo = ''; paint(); }
    if (a === 'create'){ readStep(); await createComp(d); m.close(); }
  });
  paint();
}
function parseTeamLines(txt){
  return String(txt || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => { const [n, p] = l.split('|').map(x => (x || '').trim()); return {name: n, manager: p || ''}; }).filter(x => x.name);
}
async function createComp(d){
  const c = {id: uid(), type: d.type, name: d.name || TYPES[d.type].name, season: d.season, logo: d.logo, color: d.color || TYPES[d.type].color,
    settings: {...DEFAULTS.common, ...DEFAULTS[d.type], ...(d.settings || {})}, teams: {}, matches: {}, plan: [], order: {}, groups: [], ko: null, history: [], createdAt: Date.now(), status: 'activ', by: auth.name};
  if (d.type === 'league'){ parseTeamLines(d.t1).forEach(t => newTeam(c, {...t, div: 'd1'})); parseTeamLines(d.t2).forEach(t => newTeam(c, {...t, div: 'd2'})); }
  else { parseTeamLines(d.t1).forEach(t => newTeam(c, t)); if (Object.keys(c.teams).length) autoPots(c, 'order'); }
  DB.comps[c.id] = normC(c); await Sync.comp(c); Sync.audit('A creat competiția', c);
  toast('Competiția a fost creată'); go(cpath(c, 'overview'));
}

  else {
    extra = fld('Urna', selIn('pot', t.pot || '', [['', '—'], ...Array.from({length: nP}, (_, i) => [i + 1, 'Urna ' + (i + 1)])]));
    if (c.type === 'wc' && c.groups.length) extra += fld('Grupa', selIn('group', t.group || '', [['', isNew ? 'Automat (grupa cu cele mai puține echipe)' : '—'], ...c.groups.map(g => [g.id, g.name])]));
  }

      ${fld('Jucător / manager', `<input class="in" name="manager" value="${esc(t.manager)}" placeholder="numele din joc">`)}
      ${fld('Abreviere (opțional)', `<input class="in" name="short" value="${esc(t.short || '')}" maxlength="14" placeholder="ex: RMA">`)}
      ${extra}</div><div>
      ${fld('Logo', `<div class="logo-up"><div id="tmL">${logoHTML({...t, logo}, 84)}</div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" id="tmUp">${ic('img')}Încarcă logo</button><button class="btn ghost" id="tmRm">Elimină</button></div></div>`, 'Imaginea se încadrează automat într-un pătrat.')}
      ${fld('Culoare (fără logo)', `<input class="in" type="color" name="color" value="${t.color || '#3b82f6'}" style="height:44px;padding:4px">`)}
      ${fld('Penalizare puncte', `<input class="in" type="number" name="deduct" min="0" value="${t.deduct || 0}">`, 'Se scad din clasament (ex. pentru neprezentări / abateri).')}
    </div></div>${isNew && c.type === 'ucl' && c.plan.length ? `<div class="banner">${ic('info')}Tragerea fazei ligii e deja făcută. Echipa nouă nu va avea meciuri până nu refaci tragerea (posibil doar dacă nu s-au jucat meciuri) sau adaugi meciuri manual.</div>` : ''}`,
    {wide: 'wide', okText: isNew ? 'Adaugă echipa' : 'Salvează', ok: async w => {
      const v = n => { const el = w.querySelector(`[name="${n}"]`); return el ? el.value.trim() : undefined; };
      if (!v('name')){ toast('Completează numele echipei', 'err'); return false; }
      const f = {name: v('name'), manager: v('manager'), short: v('short'), color: v('color'), logo, deduct: Math.max(0, +v('deduct') || 0)};
      if (v('div') !== undefined) f.div = v('div');
      if (v('pot') !== undefined) f.pot = v('pot') ? +v('pot') : null;
      if (v('group') !== undefined) f.group = v('group') || null;
      let team;
      if (isNew){ team = newTeam(c, f); team.deduct = f.deduct; if (f.pot == null) delete team.pot; if (c.type === 'wc' && c.groups.length && !f.group) wcAssignNew(c, team); }
      else { team = c.teams[t.id]; Object.assign(team, f); if (team.pot == null) delete team.pot; if (team.group == null) delete team.group; }
      await Sync.team(c, team); Sync.audit((isNew ? 'A adăugat echipa ' : 'A editat echipa ') + team.name, c);
      toast(isNew ? 'Echipă adăugată' : 'Echipă salvată'); render();

  $('#tmRm', m.el).onclick = () => { logo = ''; $('#tmL', m.el).innerHTML = logoHTML({...t, logo: '', color: m.el.querySelector('[name=color]').value}, 84); };

function bulkModal(c){
  const nP = c.type === 'ucl' ? c.settings.matchesPerTeam / 2 : c.settings.groupSize;
  const extra = c.type === 'league' ? fld('Adaugă în', selIn('div', ui.divSel || 'd1', [['d1', esc(c.settings.div1)], ['d2', esc(c.settings.div2)]]))
    : fld('Urna', selIn('pot', '', [['', 'Fără (le distribui după)'], ...Array.from({length: nP}, (_, i) => [i + 1, 'Urna ' + (i + 1)])]));
  modal('Adaugă echipe în bloc', `${fld('Echipe', '<textarea class="in" id="blk" style="min-height:240px" placeholder="Real Madrid | Andrei\nBarcelona | Mihai\nBayern"></textarea>', 'O echipă pe linie. Opțional jucătorul după bara verticală: <span class="kbd">Echipă | Jucător</span>')}${extra}`,
    {wide: 'wide', okText: 'Adaugă', ok: async w => {
      const L = parseTeamLines($('#blk', w).value); if (!L.length){ toast('Nicio echipă introdusă', 'err'); return false; }
      const dv = w.querySelector('[name=div]'), pt = w.querySelector('[name=pot]');
      const existing = new Set(teams(c).map(t => t.name.toLowerCase()));
      let n = 0, dup = 0;
      L.forEach(x => { if (existing.has(x.name.toLowerCase())){ dup++; return; } const t = newTeam(c, {...x, div: dv ? dv.value : undefined, pot: pt && pt.value ? +pt.value : undefined}); n++; if (c.type === 'wc' && c.groups.length) wcAssignNew(c, t); });
      await Sync.comp(c); Sync.audit(`A adăugat ${n} echipe`, c);
      toast(`${n} echipe adăugate` + (dup ? ` (${dup} existau deja)` : '')); render();
    }});
}
async function delTeam(c, id){
  const t = c.teams[id]; const L = ms(c).filter(m => m.home === id || m.away === id);
  if (!await confirmBox(`Ștergi echipa <b>${esc(t.name)}</b>?${L.length ? ` Se vor șterge și cele <b>${L.length}</b> meciuri ale ei (${L.filter(m => m.played).length} jucate).` : ''}`, 'Șterge echipa')) return;
  L.forEach(m => delete c.matches[m.id]); delete c.teams[id];
  c.plan = c.plan.filter(p => p.h !== id && p.a !== id);
  Object.keys(c.order).forEach(k => c.order[k] = c.order[k].filter(x => x !== id));
  await Sync.comp(c); Sync.audit('A șters echipa ' + t.name, c); toast('Echipă ștearsă'); if (ui.route.v === 'team') go(cpath(c, 'teams')); else render();
}

/* ---------------- meciuri ---------------- */
async function afterResult(c, m){
  if (c.ko && c.settings.autoKO){
    const r = ensureKO(c);
    if (r.created.length || r.changed.length || r.removed.length){ await Sync.matches(c, [...r.created, ...r.changed], r.removed); if (r.created.length) toast(`${r.created.length} meciuri eliminatorii create`); }
  }
  if (m && m.tie){ const f = findTie(c, m.tie); if (f){ const st = tieState(c, f.tie); if (st.needPens) toast('Egalitate la general — introdu penalty-urile la ultimul meci al dublei.', 'warn'); } }
}
async function quickSave(c, id){
  const box = document.querySelector(`[data-mid="${id}"]`); if (!box) return;
  const hs = numOr(box.querySelector('[data-k=hs]').value), as = numOr(box.querySelector('[data-k=as]').value);
  if (hs == null || as == null || hs < 0 || as < 0){ toast('Completează ambele scoruri', 'err'); return; }
  const m = c.matches[id]; Object.assign(m, {hs, as, played: true, playedAt: Date.now(), by: auth.name});
  await Sync.match(c, m); Sync.audit(`Rezultat ${TM(c, m.home)?.name} ${hs}-${as} ${TM(c, m.away)?.name}`, c);
  toast('Rezultat salvat'); await afterResult(c, m); render();
  if (m.tie && hs === as){ const f = findTie(c, m.tie); if (f && tieState(c, f.tie).needPens) matchModal(c, id); }
}
function scorerRows(list, side, names){
  return (list.length ? list : []).map(s => `<div class="sr"><input class="in sm" style="width:100%" data-sn="${side}" list="dl-${side}" value="${esc(s.n)}" placeholder="Jucător"><input class="in sm" style="width:100%" type="number" min="1" data-sg="${side}" value="${s.g || 1}"><button class="ib danger" data-rmsc>${ic('x', 15)}</button></div>`).join('');
}
function matchModal(c, id){
  const m = c.matches[id]; if (!m) return;
  const ko = m.stage === 'ko' || m.stage === 'playoff';
  const names = side => [...new Set(scorerList(c).filter(s => s.tid === (side === 'h' ? m.home : m.away)).map(s => s.name))];
  const sideBox = side => `<div><div class="row between" style="margin-bottom:8px">${teamHTML(c, side === 'h' ? m.home : m.away, {s: 26, link: false})}<button class="btn sm" data-addsc="${side}">${ic('plus', 14)}Marcator</button></div>
    <div class="scorers" id="sc-${side}">${scorerRows(m.sc[side], side)}</div><datalist id="dl-${side}">${names(side).map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>`;
  const body = `<div class="match" style="grid-template-columns:1fr auto 1fr;margin-bottom:18px;background:var(--panel)">
      <div class="h">${teamHTML(c, m.home, {s: 40, link: false})}</div>
      <div class="score"><input type="number" min="0" id="mH" value="${m.hs ?? ''}"><span class="dim">:</span><input type="number" min="0" id="mA" value="${m.as ?? ''}"></div>
      <div>${teamHTML(c, m.away, {s: 40, link: false})}</div></div>
    ${ko ? `<div class="grid g2">${fld('Penalty-uri gazde', `<input class="in" type="number" min="0" id="mPH" value="${m.ph ?? ''}">`, 'Doar dacă scorul la general e egal după prelungiri')}${fld('Penalty-uri oaspeți', `<input class="in" type="number" min="0" id="mPA" value="${m.pa ?? ''}">`)}</div>` : ''}
    <div class="grid g2">${fld('Data și ora', `<input class="in" type="datetime-local" id="mD" value="${esc(m.date || '')}">`)}${fld('Etapă', `<input class="in" ${ko ? 'disabled' : ''} type="number" min="1" id="mR" value="${m.round || 1}">`, ko ? esc(m.rlabel || '') : 'Poți muta meciul în altă etapă')}</div>
    <div class="row" style="margin-bottom:16px"><span class="muted small">Neprezentare:</span><button class="btn sm" data-ff="h">${esc(shortName(TM(c, m.home)))} câștigă 3-0</button><button class="btn sm" data-ff="a">${esc(shortName(TM(c, m.away)))} câștigă 3-0</button></div>
    ${c.settings.showScorers ? `<hr class="s"><div class="small muted" style="margin-bottom:10px;font-weight:700">MARCATORI (opțional)</div><div class="grid g2">${sideBox('h')}${sideBox('a')}</div>` : ''}`;
  const md = modal(`${esc(roundLabel(c, m))}${m.group ? ' · Grupa ' + esc(m.group) : ''}`, body, {wide: 'wide',
    extra: `<button class="btn danger" id="mDel">${ic('trash')}Șterge meciul</button>${m.played ? `<button class="btn" id="mReset">${ic('undo')}Resetează rezultatul</button>` : ''}${!m.played && !ko ? `<button class="btn ghost" id="mSwap">${ic('swap')}Inversează gazda</button>` : ''}`,
    ok: async w => {
      const hs = numOr($('#mH', w).value), as = numOr($('#mA', w).value);
      if ((hs == null) !== (as == null)){ toast('Completează ambele scoruri sau lasă-le goale', 'err'); return false; }
      const sc = {h: [], a: []};
      ['h', 'a'].forEach(s => { const ns = $$(`[data-sn="${s}"]`, w), gs = $$(`[data-sg="${s}"]`, w); ns.forEach((el, i) => { const n = el.value.trim(); if (n) sc[s].push({n, g: Math.max(1, +gs[i].value || 1)}); }); });
      if (hs != null && (sum(sc.h, x => x.g) > hs || sum(sc.a, x => x.g) > as)){ toast('Golurile marcatorilor depășesc scorul', 'err'); return false; }
      let ph = null, pa = null;
      if (ko){ ph = numOr($('#mPH', w).value); pa = numOr($('#mPA', w).value); if ((ph == null) !== (pa == null) || (ph != null && (hs !== as || ph === pa))){ if (ph != null || pa != null){ toast(hs !== as ? 'Penalty-urile se introduc doar la egalitate' : 'Penalty-urile trebuie să aibă un câștigător', 'err'); return false; } } }
      Object.assign(m, {hs, as, played: hs != null, ph, pa, sc, date: $('#mD', w).value, forfeit: m._ff && hs != null ? true : (hs == null ? false : m.forfeit || false)});
      if (!ko) m.round = Math.max(1, +$('#mR', w).value || m.round || 1);
      if (m.played && !m.playedAt) m.playedAt = Date.now();
      delete m._ff;
      await Sync.match(c, m); Sync.audit(`Meci ${TM(c, m.home)?.name} ${hs ?? '-'}-${as ?? '-'} ${TM(c, m.away)?.name} (editat)`, c);
      toast('Meci salvat'); await afterResult(c, m); render();
    }});
  const w = md.el;
  w.addEventListener('click', e => {

    const r = e.target.closest('[data-rmsc]'); if (r) r.parentElement.remove();

  });
  const del = $('#mDel', w); del.onclick = async () => {
    if (!await confirmBox('Ștergi definitiv acest meci?', 'Șterge')) return;
    delete c.matches[m.id]; await Sync.set(`comps/${c.id}/matches/${m.id}`, null); Sync.audit('A șters un meci', c); md.close(); render();
  };
  const rs = $('#mReset', w); if (rs) rs.onclick = async () => {
    Object.assign(m, {hs: null, as: null, ph: null, pa: null, played: false, forfeit: false, playedAt: null});
    await Sync.match(c, m); Sync.audit('A resetat un rezultat', c); md.close(); await afterResult(c, m); render();
  };
  const sw = $('#mSwap', w); if (sw) sw.onclick = async () => { [m.home, m.away] = [m.away, m.home]; await Sync.match(c, m); md.close(); render(); };
}

/* ---------------- tragere / generare / eliminatorii ---------------- */
async function doDraw(c){
  const N = Object.keys(c.teams).length;
  if (N < 3){ toast('Adaugă cel puțin 3 echipe', 'err'); return; }
  const stage = c.type === 'ucl' ? 'league' : 'group';
  const L = ms(c).filter(m => m.stage === stage);
  if (L.some(m => m.played)){ toast('S-au jucat meciuri — tragerea nu mai poate fi refăcută.', 'err'); return; }
  if ((c.plan.length || c.groups.length || L.length) && !await confirmBox(`Refaci tragerea la sorți? ${L.length ? `Cele ${L.length} meciuri generate vor fi șterse.` : ''}`, 'Refă tragerea')) return;
  if (c.type === 'ucl' && teams(c).some(t => !t.pot)) autoPots(c, 'order');
  try {
    L.forEach(m => delete c.matches[m.id]);
    if (c.type === 'ucl'){ const r = uclDraw(c); toast(r.mode === 'urne' ? `Tragere efectuată: ${r.rounds} etape, 2 adversari din fiecare urnă` : `Tragere echilibrată efectuată: ${r.rounds} etape`); }
    else { wcDraw(c); toast(`${c.groups.length} grupe trase la sorți`); }
    await Sync.comp(c); Sync.audit('A efectuat tragerea la sorți', c); render();
  } catch (e){ toast(e.message, 'err'); }
}
async function generate(c, all, both){
  const ph = ui.mf.phase; let out = [];
  if (c.type === 'ucl') out = uclGen(c, all);
  else poolsOf(c).filter(p => c.type === 'wc' ? (!ui.mf.group || p.gid === ui.mf.group) : (both || p.key === ph)).forEach(p => out.push(...genPool(c, p, all)));
  if (!out.length){ toast('Nu există meciuri noi de generat.', 'warn'); return; }
  await Sync.comp(c); Sync.audit(`A generat ${out.length} meciuri`, c); toast(`${out.length} meciuri generate`); render();
}
async function buildKO(c){
  const stage = c.type === 'league' ? 'playoff' : 'ko';
  const L = ms(c).filter(m => m.stage === stage);
  if (c.ko && !await confirmBox(`Refaci ${c.type === 'league' ? 'barajul' : 'tabloul eliminatoriu'} pe baza clasamentului curent?${L.length ? ` Se vor șterge cele <b>${L.length}</b> meciuri eliminatorii (${L.filter(m => m.played).length} jucate).` : ''}`, 'Refă')) return;
  try {
    L.forEach(m => delete c.matches[m.id]);
    if (c.type === 'ucl') uclBuildKO(c); else if (c.type === 'wc') wcBuildKO(c); else leagueBuildPO(c);
    if (c.settings.autoKO) ensureKO(c);
    await Sync.comp(c); Sync.audit(c.type === 'league' ? 'A creat barajul' : 'A creat tabloul eliminatoriu', c);
    toast(c.type === 'league' ? 'Baraj creat' : 'Tablou eliminatoriu creat'); ui.mf.phase = ''; render();
  } catch (e){ toast(e.message, 'err'); }
}
async function genKO(c){
  if (!c.ko){ toast('Tabloul nu a fost creat.', 'err'); return; }
  const r = ensureKO(c);
  if (!r.created.length && !r.changed.length && !r.removed.length){ toast('Nu există meciuri noi — echipele următoarelor dueluri nu sunt încă stabilite.', 'warn'); return; }
  await Sync.matches(c, [...r.created, ...r.changed], r.removed); Sync.audit(`A generat ${r.created.length} meciuri eliminatorii`, c);
  toast(`${r.created.length} meciuri create${r.changed.length ? `, ${r.changed.length} actualizate` : ''}`); if (ui.tieModal) ui.tieModal.close(); render();
}
function nextSeasonLabel(s){ s = String(s || ''); const m = s.match(/(\d+)(?!.*\d)/); if (!m) return s ? s + ' (2)' : String(new Date().getFullYear() + 1);
  if (/^\d{4}\s*[-/]\s*\d{2,4}$/.test(s.trim())){ const [a, b] = s.split(/[-/]/).map(x => x.trim()); return `${+a + 1}-${b.length === 2 ? String((+b + 1) % 100).padStart(2, '0') : +b + 1}`; }
  return s.slice(0, m.index) + (+m[1] + 1) + s.slice(m.index + m[1].length); }
async function newSeason(c){
  const s = c.settings, t1 = divTable(c, 'd1'), t2 = divTable(c, 'd2');
  if (!t1.length){ toast('Liga 1 nu are echipe.', 'err'); return; }
  const down = new Set(t1.slice(Math.max(0, t1.length - s.relegDirect)).map(r => r.id)), up = new Set(t2.slice(0, s.promoDirect).map(r => r.id));
  let pending = 0;
  if (c.ko) c.ko.rounds[0].ties.forEach(tie => { const st = tieState(c, tie); if (!st.winner){ pending++; return; } const l2 = c.teams[st.winner]?.div === 'd2'; if (l2){ up.add(st.winner); down.add(st.loser); } });
  const pr = phaseProgress(c);
  let warn = '';
  if (!pr.done) warn += `<div class="banner">${ic('info')}Sezonul regulat nu e încheiat (${pr.played}/${pr.total}).</div>`;
  if (!c.ko && Math.min(s.relegPlayoff, s.promoPlayoff) > 0) warn += `<div class="banner">${ic('info')}Barajul nu a fost creat — echipele de baraj rămân în ligile actuale.</div>`;
  if (pending) warn += `<div class="banner">${ic('info')}${pending} baraj(e) nedecis(e) — echipele rămân în ligile actuale.</div>`;
  const nm = set => [...set].map(id => esc(c.teams[id]?.name)).join(', ') || '—';
  const m = modal('Sezonul următor', `${warn}<div class="grid g2"><div class="card"><h3>${ic('arrowUp')}Urcă în ${esc(s.div1)}</h3>${nm(up)}</div><div class="card"><h3>${ic('arrowDown')}Coboară în ${esc(s.div2)}</h3>${nm(down)}</div></div><div style="height:14px"></div>
    ${fld('Eticheta noului sezon', `<input class="in" id="nsL" value="${esc(nextSeasonLabel(c.season))}">`)}<p class="muted small">Sezonul curent devine „Încheiat” și rămâne vizibil în arhivă.</p>`,
    {okText: 'Creează sezonul', ok: async w => {
      const nc = {id: uid(), type: 'league', name: c.name, season: $('#nsL', w).value.trim(), logo: c.logo, color: c.color, settings: clone(c.settings), teams: {}, matches: {}, plan: [], order: {}, groups: [], ko: null,
        history: [{season: c.season || '', champ: c.teams[t1[0].id]?.name, champ2: t2[0] ? c.teams[t2[0].id]?.name : '', up: [...up].map(id => c.teams[id]?.name), down: [...down].map(id => c.teams[id]?.name)}, ...c.history],
        createdAt: Date.now(), status: 'activ', prevId: c.id, by: auth.name};
      Object.values(c.teams).forEach(t => { const x = clone(t); x.deduct = 0; if (up.has(t.id)) x.div = 'd1'; if (down.has(t.id)) x.div = 'd2'; nc.teams[x.id] = x; });
      c.status = 'incheiat'; DB.comps[nc.id] = normC(nc);
      await Sync.upd({[`comps/${nc.id}`]: nc, [`comps/${c.id}/status`]: 'incheiat'}); Sync.audit('A început sezonul ' + nc.season, nc);
      toast('Sezon nou creat'); go(cpath(nc, 'overview'));
    }});
}

/* ---------------- capturi PNG ---------------- */
async function snap(id){
  const el = document.getElementById(id); if (!el) return;
  if (!window.html2canvas){ toast('Modulul de captură nu s-a încărcat (verifică internetul).', 'err'); return; }
  const c = C(); const head = el.querySelector('.snap-head'), foot = el.querySelector('.snap-foot');
  const title = head ? head.dataset.title || '' : '';
  if (head) head.innerHTML = `${compLogo(c, 44)}<div class="t"><b>${esc(c ? c.name : 'FC Mobile')}</b><small>${esc(title)}${c && c.season ? ' · ' + esc(c.season) : ''}</small></div>`;
  if (foot) foot.textContent = 'FC Mobile · ' + new Date().toLocaleString('ro-RO', {day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'});
  el.classList.add('capturing'); toast('Se generează imaginea…');
  try {
    await new Promise(r => setTimeout(r, 60));
    const canvas = await html2canvas(el, {backgroundColor: '#0d1428', scale: 2, logging: false, useCORS: true, windowWidth: Math.max(1280, el.scrollWidth + 80)});
    const url = canvas.toDataURL('image/png');
    const name = ((c ? c.name + '-' : '') + (title || 'captura')).replace(/[^\w\-ăâîșțĂÂÎȘȚ ]+/g, '').replace(/\s+/g, '-').toLowerCase() + '.png';
    const md = modal('Captură', `<div style="text-align:center"><img src="${url}" style="max-width:100%;border-radius:12px;border:1px solid var(--border)"></div>`, {wide: 'xwide', cancel: 'Închide',
      extra: `<button class="btn primary" id="sDl">${ic('down')}Descarcă PNG</button><button class="btn" id="sCp">${ic('copy')}Copiază</button>${navigator.share ? `<button class="btn" id="sSh">${ic('share')}Distribuie</button>` : ''}`});
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    $('#sDl', md.el).onclick = () => download(name, blob);
    $('#sCp', md.el).onclick = async () => { try { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast('Imagine copiată'); } catch { toast('Browserul nu permite copierea — folosește Descarcă.', 'err'); } };
    const sh = $('#sSh', md.el); if (sh) sh.onclick = async () => { try { await navigator.share({files: [new File([blob], name, {type: 'image/png'})], title: c ? c.name : 'FC Mobile'}); } catch {} };
  } catch (e){ console.error(e); toast('Captura a eșuat: ' + e.message, 'err'); }
  finally { el.classList.remove('capturing'); }
}

  teamGroup: async (el, d) => { const c = C(); if (!need(c)) return; const t = c.teams[d.id];
    const L = ms(c).filter(m => (m.home === t.id || m.away === t.id) && m.stage === 'group');
    if (L.some(m => m.played)){ toast('Echipa are meciuri jucate în grupă.', 'err'); render(); return; }
    L.forEach(m => delete c.matches[m.id]); t.group = el.value; await Sync.comp(c); render(); },
  mf: (el, d) => { ui.mf[d.k] = el.value; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  f(el.dataset, el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, el.dataset); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest && e.target.closest('[data-mid]')){
    const box = e.target.closest('[data-mid]'); const ins = $$('input', box);
    if (e.target === ins[0] && ins[1].value === ''){ ins[1].focus(); return; }
    quickSave(C(), box.dataset.mid);
  }
  if (e.key === 'Escape'){ const m = $$('.mb').pop(); if (m) m.querySelector('[data-x]').click(); }
});
document.addEventListener('click', e => { if (document.body.classList.contains('menu') && !e.target.closest('#sidebar') && !e.target.closest('#menuBtn')) document.body.classList.remove('menu'); });

/* ---------------- pornire ---------------- */
ui.route = parseRoute();
render();
Sync.init();
</script>
</body>
</html>
